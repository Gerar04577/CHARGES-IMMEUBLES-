      const next = JSON.parse(JSON.stringify(prev));
      if (!next.remboursements) next.remboursements = {};
      const actuel = next.remboursements[cleAjust] || {};
      next.remboursements[cleAjust] = { ...actuel, ...patch };
      return next;
    });
  };

  const saisirRemboursement = (champ, txt) => {
    setRbTextes(prev => ({ ...prev, [champ.cle]: txt }));
    const r = analyserNombre(txt);
    if (r.vide) {
      setRbErreurs(prev => ({ ...prev, [champ.cle]: null }));
      // Le decompte revient au calcul automatique ; les autres champs valent 0.
      majRemboursement({ [champ.cle]: champ.cle === "decompte" ? null : 0 });
      return;
    }
    // Etat intermediaire de frappe (« - », « , », « -, ») : ni erreur, ni ecriture.
    if (/^-?[.,]?$/.test(txt.trim())) { setRbErreurs(prev => ({ ...prev, [champ.cle]: null })); return; }
    if (!r.valide) { setRbErreurs(prev => ({ ...prev, [champ.cle]: "Montant invalide." })); return; }
    if (r.valeur < 0 && !champ.negatifAutorise) {
      setRbErreurs(prev => ({ ...prev, [champ.cle]: "Ce montant ne peut pas être négatif." })); return;
    }
    setRbErreurs(prev => ({ ...prev, [champ.cle]: null }));
    majRemboursement({ [champ.cle]: auCentime(r.valeur) });
  };

  // En quittant un champ laisse vide, on relache le texte local pour que la
  // valeur affichee redevienne celle des donnees (meme correctif que la
  // provision : sans cela le dernier chiffre serait ineffacable).
  const quitterRemboursement = (champ) => {
    const t = rbTextes[champ.cle];
    if (t !== null && t !== undefined && analyserNombre(t).vide) {
      setRbTextes(prev => ({ ...prev, [champ.cle]: null }));
    }
  };

  const valeurAffichee = (champ) => (champ.cle === "decompte" ? rbDecompte : (remb[champ.cle] || 0));

  // --- LECTURE DE GESTION LOYERS : partagee par le panneau et la comparaison ---
  const lireGestionLoyers = async () => {
    if (verrouLecture.current) return cmpContenu;   // lecture deja en cours
    verrouLecture.current = true;
    setCmpBusy(true); setCmpErreur(null);
    try {
      const contenu = await lireRemboursementsGestionLoyers();
      setCmpContenu(contenu); setCmpLuA(Date.now());
      return contenu;
    } catch (e) {
      setCmpContenu(null); setCmpErreur(e.message);
      return null;
    } finally {
      setCmpBusy(false); verrouLecture.current = false;
    }
  };

  const chargerComparaison = async () => { await lireGestionLoyers(); setCmpOuvert(true); };

  const comparaison = cmpContenu ? comparerAvecGestionLoyers(building, b.units, cmpContenu) : null;
  const comparaisonComplete = cmpContenu ? comparerTousLesLogements(data, cmpContenu) : null;

  // Ecrit les montants venant de Gestion Loyers dans le panneau.
  const reprendreValeurs = (gl) => {
    const patch = {
      // Le remboursement porte sur ce qui a ete REELLEMENT ENCAISSE, pas sur le
      // montant contractuel : un locataire qui n'a verse qu'une partie de sa
      // garantie ne peut pas se voir restituer la totalite.
      // Le repli sur garantieMontant couvre les fichiers remboursements.json
      // produits avant Gestion Loyers v85, qui n'ont pas encore ce champ.
      garantie: auCentime(gl.garantieEncaissee != null ? gl.garantieEncaissee : (gl.garantieMontant || 0)),
      retardLoyer: auCentime(gl.retardLoyer || 0),
      retardAssurance: auCentime(gl.retardAssurance || 0),
    };
    // N'ECRIT QUE SI QUELQUE CHOSE CHANGE REELLEMENT : sinon, ouvrir le
    // panneau pour regarder suffirait a marquer le fichier comme modifie.
    const identique = Object.keys(patch).every(k => (remb[k] || 0) === patch[k]);
    if (!identique) majRemboursement(patch);
    setRbTextes(prev => ({ ...prev, garantie: null, retardLoyer: null, retardAssurance: null }));
    setRbErreurs({});
  };

  // Decisions de correspondance deja prises, conservees dans les donnees OneDrive.
  const decisions = data.decisionsRemboursement || {};
  const enregistrerDecision = (accepte) => {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.decisionsRemboursement) next.decisionsRemboursement = {};
      next.decisionsRemboursement[cleDecision(building, unitId)] = accepte ? "oui" : "non";
      return next;
    });
  };

  // Un montant deja saisi pour ce logement et cette periode ne doit JAMAIS
  // etre ecrase par la reprise automatique : le travail de Gerard prime
  // toujours sur le fichier.
  const dejaSaisi = remb.garantie !== undefined
    || remb.retardLoyer !== undefined
    || remb.retardAssurance !== undefined;

  // DEFAUT 12 : le bouton « Réessayer » du panneau appelait ouvrirRemboursement,
  // qui commence par un bascule ouvert/ferme — il REFERMAIT donc le panneau au
  // lieu de relire. La lecture est desormais une fonction a part, appelee aussi
  // bien a l'ouverture que par Réessayer.
  const reprendreDepuisFichier = async () => {
    setRbDoute(null); setCmpErreur(null); setRbInfo(null);
    if (dejaSaisi) return;                      // montants deja saisis : on n'y touche pas
    // Au-dela de 5 minutes, on relit : la liste a pu etre regeneree entre-temps.
    const frais = cmpContenu && (Date.now() - cmpLuA) < FRAICHEUR_LISTE_MS;
    const contenu = frais ? cmpContenu : await lireGestionLoyers();
    if (!contenu) return;                       // echec : message affiche, champs a la main
    const cmp = comparerAvecGestionLoyers(building, b.units, contenu);
    const ligne = cmp.lignes.find(l => l.unite.id === unitId);
    if (!ligne || !ligne.gl) {
      setRbInfo("Ce logement ne figure pas dans la liste de Gestion Loyers (logement inoccupé, "
        + "ou liste pas encore régénérée). Aucun montant n'a été repris : saisissez-les à la main.");
      return;
    }
    const etat = comparerNoms(unit.tenant, ligne.gl.locataire);
    const dejaDecide = decisions[cleDecision(building, unitId)];
    if (etat === "doute" && dejaDecide !== "oui") {
      if (dejaDecide === "non") return;         // refus deja exprime : on ne redemande pas
      setRbDoute(ligne.gl);                     // on demande avant de reprendre quoi que ce soit
      return;
    }
    if (etat === "different") {
      setRbInfo("Le locataire enregistré ici (" + (unit.tenant || "aucun") + ") ne correspond pas à celui "
        + "de Gestion Loyers (" + ligne.gl.locataire + "). Aucun montant n'a été repris : saisissez-les à la main.");
      return;
    }
    reprendreValeurs(ligne.gl);
  };

  /* ===== AUTRES IMMEUBLES : logique ===================================== */
  const autParImmeuble = cmpContenu ? logementsAutresImmeubles(cmpContenu) : null;
  const autListe = (autParImmeuble && autParImmeuble[autImmeuble]) || [];
  const autEntree = autListe.find(l => l.unite === autUnite) || null;
  const autCle = autEntree ? cleAutre(autImmeuble, autEntree.unite) : null;
  const autMontants = (autCle && data.remboursementsAutres && data.remboursementsAutres[autCle]) || {};
  const autTotal = totalAutreImmeuble(autMontants);

  // La lecture est une fonction A PART : « Réessayer » doit relire, pas
  // refermer le panneau (defaut deja corrige cote Remboursement, reproduit ici).
  const lireListeAutres = async () => {
    setAutMsg(null);
    const frais = cmpContenu && (Date.now() - cmpLuA) < FRAICHEUR_LISTE_MS;
    if (!frais || cmpErreur) await lireGestionLoyers();
  };

  const ouvrirAutres = async () => {
    if (autOuvert) { setAutOuvert(false); return; }
    // DEFAUT 15 : les deux panneaux pouvaient rester ouverts en meme temps,
    // avec DEUX blocs « TOTAL À REMBOURSER » a l'ecran portant sur des
    // logements differents. Ouvrir l'un referme desormais l'autre.
    setRbOuvert(false); setRbDoute(null); setRbInfo(null);
    setAutOuvert(true); setAutApercu(false);
    await lireListeAutres();
  };

  const majAutre = (cle, patch) => {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.remboursementsAutres) next.remboursementsAutres = {};
      const actuel = next.remboursementsAutres[cle] || {};
      next.remboursementsAutres[cle] = { ...actuel, ...patch };
      return next;
    });
  };

  // Choix d'un logement : preremplissage depuis Gestion Loyers, SAUF si des
  // montants ont deja ete saisis — le travail de Gerard prime toujours.
  const choisirUniteAutre = (unite) => {
    setAutUnite(unite); setAutTextes({}); setAutErreurs({}); setAutApercu(false); setAutMsg(null);
    const entree = autListe.find(l => l.unite === unite);
    if (!entree) return;
    const cle = cleAutre(autImmeuble, entree.unite);
    const deja = (data.remboursementsAutres && data.remboursementsAutres[cle]) || {};
    const dejaSaisiAutre = deja.garantie !== undefined || deja.retardLoyer !== undefined
      || deja.retardAssurance !== undefined || deja.degats !== undefined;
    if (dejaSaisiAutre) return;
    const patch = {
      // Meme regle que ci-dessus : on part de l'encaisse, avec repli sur le
      // montant contractuel pour les anciens fichiers.
      garantie: auCentime(entree.garantieEncaissee != null ? entree.garantieEncaissee : (entree.garantieMontant || 0)),
      retardLoyer: auCentime(entree.retardLoyer || 0),
      retardAssurance: auCentime(entree.retardAssurance || 0),
    };
    // On n'ecrit que si quelque chose change vraiment : consulter n'est pas modifier.
    const identique = Object.keys(patch).every(k => (deja[k] || 0) === patch[k]);
    if (!identique) majAutre(cle, patch);
  };

  const saisirAutre = (champ, txt) => {
    setAutTextes(prev => ({ ...prev, [champ.cle]: txt }));
    if (!autCle) return;
    const r = analyserNombre(txt);
    if (r.vide) { setAutErreurs(prev => ({ ...prev, [champ.cle]: null })); majAutre(autCle, { [champ.cle]: 0 }); return; }
    if (/^-?[.,]?$/.test(txt.trim())) { setAutErreurs(prev => ({ ...prev, [champ.cle]: null })); return; }
    if (!r.valide) { setAutErreurs(prev => ({ ...prev, [champ.cle]: "Montant invalide." })); return; }
    if (r.valeur < 0) { setAutErreurs(prev => ({ ...prev, [champ.cle]: "Ce montant ne peut pas être négatif." })); return; }
    setAutErreurs(prev => ({ ...prev, [champ.cle]: null }));
    majAutre(autCle, { [champ.cle]: auCentime(r.valeur) });
  };

  const quitterAutre = (champ) => {
    const t = autTextes[champ.cle];
    if (t !== null && t !== undefined && analyserNombre(t).vide) {
      setAutTextes(prev => ({ ...prev, [champ.cle]: null }));
    }
  };

  const enregistrerAutreWord = async () => {
    if (!autEntree || verrouEnvoiAutre.current) return;   // deuxieme appui : ignore
    verrouEnvoiAutre.current = true;
    setAutBusy(true); setAutMsg(null);
    try {
      // v32 — meme regle que le remboursement des trois immeubles :
      // les montants d'abord, le document ensuite.
      const sauv = await enregistrerDonneesOneDrive(data);
      if (!sauv.ok) {
        setAutMsg({ type: "err", texte: sauv.conflit
          ? "Rien n'a été enregistré : quelqu'un d'autre a enregistré entre-temps. Recharge la page, puis recommence."
          : "Rien n'a été enregistré : " + sauv.motif + ". Le document n'a pas été créé." });
        return;
      }
      const res = await saveAutreOneDrive(NOM_AUTRE_IMMEUBLE[autImmeuble] || autImmeuble,
        autEntree.unite, autEntree.locataire, autMontants, autTotal);
      setAutMsg({ type: "ok", texte: "✓ Montants enregistrés · Document créé dans "
        + cheminLisible(res.folderPath, res.filename) });
    } catch (e) {
      setAutMsg({ type: "err", texte: "Montants enregistrés, mais le document a échoué : " + e.message });
    } finally {
      setAutBusy(false); verrouEnvoiAutre.current = false;
    }
  };

  // Ouverture du panneau : bascule, puis lecture.
  const ouvrirRemboursement = async () => {
    if (rbOuvert) { setRbOuvert(false); return; }
    setAutOuvert(false); setAutApercu(false);   // un seul panneau ouvert a la fois
    setRbOuvert(true);
    await reprendreDepuisFichier();
  };

  // Permet de revenir sur un « Non » : sans cela, un clic malheureux
  // privait le logement de toute reprise automatique, definitivement.
  const annulerDecision = async () => {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (next.decisionsRemboursement) delete next.decisionsRemboursement[cleDecision(building, unitId)];
      return next;
    });
    const frais = cmpContenu && (Date.now() - cmpLuA) < FRAICHEUR_LISTE_MS;
    const contenu = frais ? cmpContenu : await lireGestionLoyers();
    if (!contenu) return;
    const cmp = comparerAvecGestionLoyers(building, b.units, contenu);
    const ligne = cmp.lignes.find(l => l.unite.id === unitId);
    if (ligne && ligne.gl) setRbDoute(ligne.gl);
  };

  const enregistrerRemboursementWord = async () => {
    if (verrouEnvoi.current) return;            // deuxieme appui rapproche : ignore
    // Rien n'a encore ete prepare pour ce logement : on ouvre le panneau, on va
    // chercher les montants, et on demande une confirmation. Sans ce garde-fou,
    // un document a zero partait sur OneDrive en annoncant « enregistré ».
    if (!rbOuvert && !dejaSaisi) {
      setRbOuvert(true); setAutOuvert(false);
      await reprendreDepuisFichier();
      setRbMsg({ type: "err", texte: "Vérifie les montants ci-dessous, puis appuie de nouveau sur « Sauver remboursement »." });
      return;
    }
    verrouEnvoi.current = true;
    setRbBusy(true); setRbMsg(null);
    try {
      // v32 — LES MONTANTS D'ABORD, LE DOCUMENT ENSUITE.
      // Si l'enregistrement echoue, on ne cree PAS le Word : mieux vaut aucun
      // document qu'un document remis au locataire dont les chiffres seront
      // perdus a la fermeture de l'onglet.
      const sauv = await enregistrerDonneesOneDrive(data);
      if (!sauv.ok) {
        setRbMsg({ type: "err", texte: sauv.conflit
          ? "Rien n'a été enregistré : quelqu'un d'autre a enregistré entre-temps. Recharge la page, puis recommence."
          : "Rien n'a été enregistré : " + sauv.motif + ". Le document n'a pas été créé." });
        return;
      }
      const res = await saveRemboursementOneDrive(b.name, unit.name, unit.tenant || "Locataire", periodLabel, remb, rbDecompte, rbTotal);
      setRbMsg({ type: "ok", texte: "✓ Montants enregistrés · Document créé dans "
        + cheminLisible(res.folderPath, res.filename) });
    } catch (e) {
      setRbMsg({ type: "err", texte: "Montants enregistrés, mais le document a échoué : " + e.message });
    } finally {
      setRbBusy(false); verrouEnvoi.current = false;
    }
  };


  const openCurrentPreview = () => {
    setPreview({
      b, unit, tenant: unit.tenant || "Locataire", period: periodLabel,
      lines: buildLines(firstLineCost, { conso: elecConso, cost: elecCost, days }, { conso: eauConso, cost: eauCost, days }, unit.hasIsta, skipHeatingRow),
      totals: { diff },
    });
  };

  const openArchivedPreview = (a) => {
    const periodLbl = `${fmtDate(a.from)} - ${fmtDate(a.to)}`;
    const lines = buildLines(a.mazout.cost, a.elec, a.eau, a.mazout.isIsta, skipHeatingRow);
    const lastIdx = lines.length - 1;
    setPreview({
      b, unit, tenant: a.tenant || "Locataire", period: periodLbl,
      lines: lines.map((l, i) => i === lastIdx ? { ...l,
        totalCell: fmtNum(a.total, 2), provCell: fmtNum(a.provision, 2),
        diffCell: (a.diff < 0 ? "-" : "") + fmtNum(Math.abs(a.diff), 2) } : l),
      totals: { diff: a.diff },
    });
  };

  if (preview) {
    return (
      <DecomptePreview
        b={preview.b} unit={preview.unit} tenant={preview.tenant} period={preview.period}
        lines={preview.lines} totals={preview.totals}
        onClose={() => setPreview(null)}
        onShareDoc={() => shareDecompteDoc(preview.b.name, preview.unit.name, preview.tenant, preview.period, preview.lines, preview.totals)}
        onDownloadDoc={() => downloadDecompteDoc(preview.b.name, preview.unit.name, preview.tenant, preview.period, preview.lines, preview.totals)}
        onSaveDecompteOneDrive={() => saveDecompteOneDrive(preview.b.name, preview.unit.name, preview.tenant, preview.period, preview.lines, preview.totals)}
      />
    );
  }

  // Les boutons et panneaux du remboursement sont montes en variable pour etre
  // affiches AUSSI sur un logement a compteur prive : les 50 logements doivent
  // pouvoir donner lieu a un remboursement, y compris ceux qui n'ont pas de
  // decompte de charges.
  const blocRemboursement = (
    <>
        {/* ===== MODULE REMBOURSEMENT — boutons et panneau ===== */}
      <div className="row" style={{ marginTop: 8 }}>
        <button className="btn btn-primary" onClick={ouvrirRemboursement} disabled={cmpBusy && !rbOuvert}>
          💶 {(cmpBusy && !rbOuvert) ? "Lecture…" : (rbOuvert ? "Fermer le remboursement" : "Remboursement")}
        </button>
        <button className="btn" onClick={() => setRbAide(v => !v)}
          title="D'où viennent ces montants ?"
          style={{ minWidth: 38, justifyContent: "center", fontWeight: 800 }}>
          ?
        </button>
        <button className="btn btn-accent" onClick={enregistrerRemboursementWord} disabled={rbBusy}>
          <Save size={14} /> {rbBusy ? "Envoi en cours…" : "Sauver remboursement"}
        </button>
      </div>

      {/* Bouton centre, en bleu-gris pastel : les quatre immeubles sans decompte. */}
      <div style={{ marginTop: 8, display: "flex", justifyContent: "center" }}>
        <button className="btn" onClick={ouvrirAutres} disabled={cmpBusy && !autOuvert}
          style={{
            width: "66%", justifyContent: "center", textAlign: "center",
            background: BLEU_PASTEL, borderColor: BLEU_PASTEL_BORD, color: INK, fontWeight: 700,
          }}>
          🏢 {(cmpBusy && !autOuvert) ? "Lecture…" : (autOuvert ? "Fermer les autres immeubles" : "Autres immeubles")}
        </button>
      </div>

      {autOuvert && (
        <div style={{ marginTop: 12, background: PAPER, borderRadius: 10, padding: "12px 14px" }}>
          <div style={{ fontWeight: 700, marginBottom: 4 }}>Remboursement — autres immeubles</div>
          <div style={{ fontSize: 12, color: MUTED, marginBottom: 8, lineHeight: 1.5 }}>
            Havré, Vannes, La Fermette et Egmont : les compteurs sont ouverts au nom du locataire,
            il n'y a donc aucun décompte de charges. Seule la garantie est calculée.
          </div>

          {cmpErreur ? (
            <div>
              <div style={{ background: "#b91c1c", color: "#fff", borderRadius: 8, padding: "10px 12px", fontSize: 13.5, lineHeight: 1.5 }}>
                Pas de connexion — impossible de lire la liste de Gestion Loyers : {cmpErreur}
              </div>
              <button className="btn btn-primary" style={{ marginTop: 8 }} onClick={lireListeAutres} disabled={cmpBusy}>
                🔄 Réessayer
              </button>
            </div>
          ) : !autParImmeuble ? (
            <div style={{ fontSize: 13, color: MUTED }}>Lecture en cours…</div>
          ) : (
            <div>
              <span className="label">Immeuble</span>
              <select value={autImmeuble} onChange={e => {
                setAutImmeuble(e.target.value); setAutUnite(""); setAutTextes({});
                setAutErreurs({}); setAutApercu(false); setAutMsg(null);
              }}>
                <option value="">— choisir —</option>
                {AUTRES_IMMEUBLES.filter(id => (autParImmeuble[id] || []).length > 0).map(id => (
                  <option key={id} value={id}>
                    {NOM_AUTRE_IMMEUBLE[id]} ({autParImmeuble[id].length})
                  </option>
                ))}
              </select>

              {autImmeuble && (
                <div style={{ marginTop: 10 }}>
                  <span className="label">Logement</span>
                  <select value={autUnite} onChange={e => choisirUniteAutre(e.target.value)}>
                    <option value="">— choisir —</option>
                    {autListe.map(l => (
                      <option key={l.unite} value={l.unite}>{l.unite} — {l.locataire}</option>
                    ))}
                  </select>
                </div>
              )}

              {autEntree && (
                <div style={{ marginTop: 12 }}>
                  <div style={{ fontWeight: 700 }}>{autEntree.locataire}</div>
                  <div style={{ fontSize: 12, color: MUTED }}>
                    {NOM_AUTRE_IMMEUBLE[autImmeuble]} — {autEntree.unite}
                  </div>

                  {CHAMPS_AUTRE_IMMEUBLE.map(champ => (
                    <ChampRemboursement key={champ.cle}
                      libelle={champ.libelle}
                      texte={autTextes[champ.cle]}
                      valeurAffichee={autMontants[champ.cle] || 0}
                      erreur={autErreurs[champ.cle]}
                      onTexte={txt => saisirAutre(champ, txt)}
                      onSortie={() => quitterAutre(champ)} />
                  ))}

                  <div style={{ fontSize: 12, color: MUTED, marginTop: 8, lineHeight: 1.5 }}>
                    Garantie − retard de loyer − retard d'assurance − dégâts.
                    Garantie et retards viennent de Gestion Loyers ; les dégâts sont à saisir.
                  </div>

                  <div className="between" style={{ marginTop: 12, background: "#fff", borderRadius: 10, padding: "12px 14px" }}>
                    <div style={{ fontWeight: 800, fontSize: 15 }}>TOTAL À REMBOURSER</div>
                    <MeterDigits value={(autTotal < 0 ? "-" : "") + fmtEUR(Math.abs(autTotal))} cls={autTotal < 0 ? "red" : ""} />
                  </div>

                  <div className="row" style={{ marginTop: 10 }}>
                    <button className="btn btn-primary" onClick={() => setAutApercu(v => !v)}>
                      <FileText size={14} /> {autApercu ? "Fermer l'aperçu" : "Voir le document"}
                    </button>
                    <button className="btn btn-accent" onClick={enregistrerAutreWord} disabled={autBusy}>
                      <Save size={14} /> {autBusy ? "Envoi en cours…" : "Enregistrer le document"}
                    </button>
                  </div>

                  {autMsg && (
                    <div style={{ marginTop: 8, fontSize: 13, fontWeight: 600, color: autMsg.type === "ok" ? INK : "#b91c1c" }}>
                      {autMsg.texte}
                    </div>
                  )}

                  {autApercu && (
                    <div style={{ marginTop: 12, background: "#fff", borderRadius: 10, padding: "14px 16px" }}>
                      <div style={{ fontWeight: 800, marginBottom: 2 }}>
                        {NOM_AUTRE_IMMEUBLE[autImmeuble]} — {autEntree.unite}
                      </div>
                      <div style={{ fontWeight: 700, marginBottom: 8 }}>{autEntree.locataire}</div>
                      <div style={{ fontSize: 12.5, color: MUTED, marginBottom: 10, lineHeight: 1.5 }}>
                        Les compteurs de ce logement étant ouverts au nom du locataire,
                        aucun décompte de charges n'est établi.
                      </div>
                      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
                        <tbody>
                          <tr style={{ borderTop: "1px solid " + LINE }}>
                            <td style={{ padding: "6px 4px" }}>Garantie locative</td>
                            <td style={{ padding: "6px 4px", textAlign: "right" }}>{fmtEUR(autMontants.garantie || 0)}</td>
                          </tr>
                          <tr style={{ borderTop: "1px solid " + LINE }}>
                            <td style={{ padding: "6px 4px" }}>Retard de loyer</td>
                            <td style={{ padding: "6px 4px", textAlign: "right" }}>
                              {(autMontants.retardLoyer || 0) > 0 ? "- " : ""}{fmtEUR(autMontants.retardLoyer || 0)}
                            </td>
                          </tr>
                          <tr style={{ borderTop: "1px solid " + LINE }}>
                            <td style={{ padding: "6px 4px" }}>Retard d'assurance</td>
                            <td style={{ padding: "6px 4px", textAlign: "right" }}>
                              {(autMontants.retardAssurance || 0) > 0 ? "- " : ""}{fmtEUR(autMontants.retardAssurance || 0)}
                            </td>
                          </tr>
                          <tr style={{ borderTop: "1px solid " + LINE }}>
                            <td style={{ padding: "6px 4px" }}>Dégâts locatifs</td>
                            <td style={{ padding: "6px 4px", textAlign: "right" }}>
                              {(autMontants.degats || 0) > 0 ? "- " : ""}{fmtEUR(autMontants.degats || 0)}
                            </td>
                          </tr>
                          <tr style={{ borderTop: "2px solid " + INK, background: PAPER }}>
                            <td style={{ padding: "8px 4px", fontWeight: 800 }}>TOTAL À REMBOURSER</td>
                            <td style={{ padding: "8px 4px", textAlign: "right", fontWeight: 800, color: autTotal < 0 ? "#b91c1c" : INK }}>
                              {(autTotal < 0 ? "- " : "") + fmtEUR(Math.abs(autTotal))}
                            </td>
                          </tr>
                        </tbody>
                      </table>
                      <div style={{ fontSize: 12, color: MUTED, marginTop: 10, lineHeight: 1.5 }}>
                        Un total négatif signifie que le locataire reste redevable de ce montant.
                        Un total positif est à lui rembourser.
                      </div>
                    </div>
                  )}

                  <div style={{ fontSize: 12, color: MUTED, marginTop: 10, lineHeight: 1.5 }}>
                    Ces montants sont conservés : pensez à « ☁️ Sauvegarde automatique OneDrive »
                    avant de fermer l'application.
                  </div>
                </div>
              )}
            </div>
          )}

          <div style={{ marginTop: 14, paddingTop: 10, borderTop: "1px solid " + LINE, display: "flex", justifyContent: "center" }}>
            <button className="btn" onClick={() => { setAutOuvert(false); setAutApercu(false); }} style={{ width: "66%", justifyContent: "center", textAlign: "center", fontWeight: 700 }}>
              ← Retour
            </button>
          </div>
        </div>
      )}

      {/* Bouton centre, en beige sable : il se distingue des deux rangees
          d'actions au-dessus sans jurer avec la palette de l'application. */}
      <div style={{ marginTop: 8, display: "flex", justifyContent: "center" }}>
        <button className="btn"
          onClick={() => (cmpOuvert ? setCmpOuvert(false) : chargerComparaison())}
          disabled={cmpBusy}
          style={{
            width: "66%", justifyContent: "center", textAlign: "center",
            background: SABLE, borderColor: SABLE_BORD, color: INK, fontWeight: 700,
          }}>
          🔗 {cmpBusy ? "Lecture…" : (cmpOuvert ? "Fermer la comparaison" : "Comparer les noms avec GL")}
        </button>
      </div>

      {/* ===== COMPARAISON DES 50 LOGEMENTS ===== */}
      {cmpOuvert && (
        <div style={{ marginTop: 12, background: PAPER, borderRadius: 10, padding: "12px 14px" }}>
          <div style={{ fontWeight: 700, marginBottom: 6 }}>Comparaison des noms — tous les immeubles</div>

          {cmpErreur ? (
            <div>
              <div style={{ background: "#b91c1c", color: "#fff", borderRadius: 8, padding: "10px 12px", fontSize: 13.5, lineHeight: 1.5 }}>
                Pas de connexion — lecture impossible : {cmpErreur}
                <div style={{ marginTop: 4, fontWeight: 400 }}>
                  Vérifie que la liste a bien été enregistrée depuis Gestion Loyers
                  (vue « 📋 Liste remboursement », bouton « 📤 Enregistrer sur OneDrive »).
                </div>
              </div>
              <button className="btn btn-primary" style={{ marginTop: 8 }} onClick={chargerComparaison} disabled={cmpBusy}>
                🔄 Réessayer
              </button>
            </div>
          ) : comparaisonComplete ? (
            <div>
              <div style={{ fontSize: 12, color: MUTED, marginBottom: 8, lineHeight: 1.5 }}>
                Liste générée le {fmtDate((cmpContenu.genereLe || "").slice(0, 10))} —{" "}
                {Object.values(comparaisonComplete.parImmeuble).reduce((n, l) => n + l.length, 0)} logements occupés
                sur {Object.keys(comparaisonComplete.parImmeuble).length} immeubles.
                <br />
                <span style={{ color: INK }}>■</span> concordant ·{" "}
                <span style={{ color: "#b45309" }}>■</span> à confirmer ·{" "}
                <span style={{ color: "#b91c1c" }}>■</span> locataire différent
              </div>

              {Object.keys(comparaisonComplete.parImmeuble).map(nomImm => (
                <div key={nomImm} style={{ marginBottom: 14 }}>
                  <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 4 }}>{nomImm}</div>
                  <div className="scrollx">
                    <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
                      <thead>
                        <tr style={{ textAlign: "left", color: MUTED }}>
                          <th style={{ padding: "3px 5px" }}>Logement</th>
                          <th style={{ padding: "3px 5px" }}>Ici</th>
                          <th style={{ padding: "3px 5px" }}>Gestion Loyers</th>
                          <th style={{ padding: "3px 5px", textAlign: "right" }}>Garantie</th>
                          <th style={{ padding: "3px 5px", textAlign: "right" }}>Loyer</th>
                          <th style={{ padding: "3px 5px", textAlign: "right" }}>Assur.</th>
                        </tr>
                      </thead>
                      <tbody>
                        {comparaisonComplete.parImmeuble[nomImm].map((r, i) => {
                          const couleur = r.etat === "different" ? "#b91c1c" : (r.etat === "doute" ? "#b45309" : INK);
                          return (
                            <tr key={i} style={{ borderTop: "1px solid " + LINE, color: couleur }}>
                              <td style={{ padding: "5px" }}>{r.unite ? r.unite.name : r.gl.unite}</td>
                              <td style={{ padding: "5px" }}>{r.dansApp ? (r.unite.tenant || "—") : <i style={{ color: MUTED }}>pas de décompte · voir « Autres immeubles »</i>}</td>
                              <td style={{ padding: "5px" }}>{r.gl.locataire}</td>
                              <td style={{ padding: "5px", textAlign: "right" }}>
                                {(() => {
                                  const enc = r.gl.garantieEncaissee != null ? r.gl.garantieEncaissee : r.gl.garantieMontant;
                                  if (!enc && !r.gl.garantieMontant) return "—";
                                  const partielle = r.gl.garantieEncaissee != null && r.gl.garantieMontant > r.gl.garantieEncaissee;
                                  return partielle
                                    ? fmtEUR(enc || 0) + " / " + fmtEUR(r.gl.garantieMontant)
                                    : fmtEUR(enc || 0);
                                })()}
                              </td>
                              <td style={{ padding: "5px", textAlign: "right" }}>{r.gl.retardLoyer ? fmtEUR(r.gl.retardLoyer) : "—"}</td>
                              <td style={{ padding: "5px", textAlign: "right" }}>{r.gl.retardAssurance ? fmtEUR(r.gl.retardAssurance) : "—"}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              ))}

              {comparaisonComplete.absentsDuFichier.length > 0 && (
                <div style={{ marginTop: 10, fontSize: 12, color: MUTED, lineHeight: 1.5 }}>
                  Logements de cette application absents du fichier (inoccupés ou non repris) :{" "}
                  {comparaisonComplete.absentsDuFichier.map(a => a.immeubleNom + " / " + a.unite.name).join(", ")}
                </div>
              )}

              <div style={{ marginTop: 10, fontSize: 12, color: MUTED, lineHeight: 1.5 }}>
                Les logements « à confirmer » vous seront soumis à l'ouverture du panneau Remboursement,
                avec une question à laquelle vous répondrez une seule fois.
              </div>
            </div>
          ) : (
            <div style={{ fontSize: 13, color: MUTED }}>Lecture en cours…</div>
          )}

          <div style={{ marginTop: 14, paddingTop: 10, borderTop: "1px solid " + LINE, display: "flex", justifyContent: "center" }}>
            <button className="btn" onClick={() => setCmpOuvert(false)} style={{ width: "66%", justifyContent: "center", textAlign: "center", fontWeight: 700 }}>
              ← Retour
            </button>
          </div>
        </div>
      )}
      {/* ===== fin de la comparaison ===== */}

      {rbMsg && (
        <div style={{ marginTop: 8, fontSize: 13, fontWeight: 600, color: rbMsg.type === "ok" ? INK : "#b91c1c" }}>
          {rbMsg.texte}
        </div>
      )}

      {rbAide && (
        <div style={{ marginTop: 12, background: "#eef4f0", border: "1px solid " + LINE, borderRadius: 10, padding: "12px 14px", fontSize: 13, lineHeight: 1.6 }}>
          <div style={{ fontWeight: 800, marginBottom: 6 }}>D'où viennent ces montants ?</div>
          <p style={{ marginTop: 0 }}>
            Garantie, retard de loyer et retard d'assurance viennent de <b>Gestion Loyers</b>.
            Ils ne se saisissent pas ici. Le fichier est lu <b>automatiquement</b> à l'ouverture de
            ce panneau : il n'y a aucun bouton « charger ».
          </p>
          <p>
            <b>Montants périmés ?</b> Le fichier est gardé en mémoire quelques minutes.
            Referme ce panneau et rouvre-le. Si besoin, recharge la page.
          </p>
          <p>
            <b>Garantie</b> = ce qui a été <b>réellement encaissé</b>, pas le montant du bail.
            Quand les deux diffèrent, l'affichage montre les deux.
          </p>
          <p style={{ marginBottom: 0 }}>
            <b>Décompte</b> = seule ligne qui s'additionne. Positif : tu dois au locataire.
            Négatif : il te doit des charges. Le mode d'emploi détaille tout cela.
          </p>
          <div style={{ marginTop: 12, paddingTop: 10, borderTop: "1px solid " + LINE, display: "flex", justifyContent: "center" }}>
            <button className="btn" onClick={() => setRbAide(false)} style={{ width: "66%", justifyContent: "center", textAlign: "center", fontWeight: 700 }}>
              ← Retour
            </button>
          </div>
        </div>
      )}

      {rbOuvert && (
        <div style={{ marginTop: 12, background: PAPER, borderRadius: 10, padding: "12px 14px" }}>
          <div style={{ fontWeight: 700, marginBottom: 4 }}>Remboursement de la garantie</div>
          <div style={{ fontSize: 12, color: MUTED }}>
            {unit.tenant || "Locataire"} — {periodLabel}
          </div>

          {cmpErreur && (
            <div style={{ background: "#fdf3e3", border: "2px solid #b45309", color: "#7c3f06", borderRadius: 8, padding: "10px 12px", marginTop: 8, fontSize: 13, lineHeight: 1.5 }}>
              <b>Pas de connexion</b> — impossible de lire les données de Gestion Loyers.
              <div style={{ marginTop: 4 }}>{cmpErreur}</div>
              <div style={{ marginTop: 4 }}>Les champs restent vides : tu peux saisir les montants à la main.</div>
              <button className="btn btn-primary" style={{ marginTop: 8 }} onClick={reprendreDepuisFichier} disabled={cmpBusy}>
                🔄 Réessayer
              </button>
            </div>
          )}

          {rbInfo && !rbDoute && (
            <div style={{ background: "#fdf3e3", border: "2px solid #b45309", color: "#7c3f06", borderRadius: 8, padding: "10px 12px", marginTop: 8, fontSize: 13, lineHeight: 1.5 }}>
              {rbInfo}
            </div>
          )}

          {!rbDoute && decisions[cleDecision(building, unitId)] === "non" && (
            <div style={{ fontSize: 12, color: MUTED, marginTop: 8, lineHeight: 1.5 }}>
              Vous aviez répondu « Non » pour ce logement : les montants de Gestion Loyers
              ne sont plus repris automatiquement.{" "}
              <button className="btn" style={{ padding: "3px 10px", fontSize: 12, marginTop: 4 }}
                onClick={annulerDecision} disabled={cmpBusy}>
                Revenir sur ce choix
              </button>
            </div>
          )}

          {!rbDoute && dejaSaisi && (
            <div style={{ fontSize: 12, color: MUTED, marginTop: 8, lineHeight: 1.5 }}>
              Montants déjà enregistrés pour ce logement : ils sont conservés tels quels,
              la reprise automatique ne les écrase pas.
            </div>
          )}

          {rbDoute && (
            <div style={{ background: "#fdf3e3", border: "2px solid #b45309", color: "#7c3f06", borderRadius: 8, padding: "10px 12px", marginTop: 8, fontSize: 13, lineHeight: 1.5 }}>
              <div style={{ fontWeight: 800 }}>S'agit-il du même locataire ?</div>
              <div style={{ marginTop: 6 }}>Ici : <b>{unit.tenant || "(vide)"}</b></div>
              <div>Gestion Loyers : <b>{rbDoute.locataire}</b></div>
              <div style={{ marginTop: 6 }}>
                Garantie encaissée {fmtEUR(rbDoute.garantieEncaissee != null ? rbDoute.garantieEncaissee : (rbDoute.garantieMontant || 0))}
                {rbDoute.garantieEncaissee != null && rbDoute.garantieMontant > rbDoute.garantieEncaissee
                  ? " (sur " + fmtEUR(rbDoute.garantieMontant) + " dus)" : ""}
                {rbDoute.retardLoyer ? " · retard loyer " + fmtEUR(rbDoute.retardLoyer) : ""}
                {rbDoute.retardAssurance ? " · retard assurance " + fmtEUR(rbDoute.retardAssurance) : ""}
              </div>
              <div className="row" style={{ marginTop: 8 }}>
                <button className="btn btn-accent" onClick={() => { enregistrerDecision(true); reprendreValeurs(rbDoute); setRbDoute(null); }}>
                  Oui, reprendre ces montants
                </button>
                <button className="btn" onClick={() => { enregistrerDecision(false); setRbDoute(null); }}>
                  Non
                </button>
              </div>
              <div style={{ fontSize: 12, marginTop: 6 }}>Ta réponse est conservée : la question ne sera plus posée.</div>
            </div>
          )}

          {CHAMPS_REMBOURSEMENT.map(champ => (
            <ChampRemboursement key={champ.cle}
              libelle={champ.libelle}
              texte={rbTextes[champ.cle]}
              valeurAffichee={valeurAffichee(champ)}
              erreur={rbErreurs[champ.cle]}
              onTexte={txt => saisirRemboursement(champ, txt)}
              onSortie={() => quitterRemboursement(champ)} />
          ))}

          <div style={{ fontSize: 12, color: MUTED, marginTop: 8, lineHeight: 1.5 }}>
            Garantie − retard de loyer − retard d'assurance + décompte − dégâts.
            Le décompte garde son signe : positif s'il vous est dû par vous, négatif si le locataire vous doit.
            Videz le champ Décompte pour revenir à la valeur calculée ci-dessus.
          </div>

          <div className="between" style={{ marginTop: 12, background: "#fff", borderRadius: 10, padding: "12px 14px" }}>
            <div style={{ fontWeight: 800, fontSize: 15 }}>TOTAL À REMBOURSER</div>
            <MeterDigits value={(rbTotal < 0 ? "-" : "") + fmtEUR(Math.abs(rbTotal))} cls={rbTotal < 0 ? "red" : ""} />
          </div>

          <div style={{ fontSize: 12, color: MUTED, marginTop: 8 }}>
            Ces montants sont conservés : pensez à « ☁️ Sauvegarde automatique OneDrive » avant de fermer l'application.
          </div>

          <div style={{ marginTop: 14, paddingTop: 10, borderTop: "1px solid " + LINE, display: "flex", justifyContent: "center" }}>
            <button className="btn" onClick={() => { setRbOuvert(false); setRbDoute(null); }} style={{ width: "66%", justifyContent: "center", textAlign: "center", fontWeight: 700 }}>
              ← Retour
            </button>
          </div>
        </div>
      )}
      {/* ===== MODULE REMBOURSEMENT — fin du panneau ===== */}
    </>
  );

  if (unit.privateMeterOnly) {
    return (
      <div>
        <div className="card">
          <span className="label">Logement</span>
          <select value={unitId} onChange={e => changerLogement(e.target.value)}>
            {b.units.map(u => <option key={u.id} value={u.id}>{u.name} — {u.tenant || "Vacant"}</option>)}
          </select>
        </div>
        <div className="card">
          <div style={{ fontWeight: 700, marginBottom: 6 }}>{unit.name} — compteur privé</div>
          <div style={{ fontSize: 13, color: MUTED }}>
            Ce logement dispose de son propre compteur électrique indépendant et n'est pas inclus dans les
            décomptes de charges communes (eau, chauffage, nettoyage). Aucun décompte n'est calculé ici,
            mais le remboursement de la garantie reste possible : le décompte vaut alors zéro.
          </div>
        </div>
        <div className="card">
          {blocRemboursement}
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="card">
        <span className="label">Logement</span>
        <select value={unitId} onChange={e => changerLogement(e.target.value)}>
          {b.units.map(u => <option key={u.id} value={u.id}>{u.name} — {u.tenant || "Vacant"}</option>)}
        </select>
      </div>

      <div className="card">
        <div style={{ fontWeight: 700, marginBottom: 4 }}>Période en cours</div>
        <div style={{ fontSize: 13, color: MUTED, marginBottom: 10 }}>{periodLabel} ({days} jours) — {unit.tenant || "Vacant"}</div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
          <div>
            <span className="label">Début de période</span>
            <input type="date" value={periodFrom} onChange={e => setPeriodFromOverride(e.target.value || null)} />
          </div>
          <div>
            <span className="label">Fin de période</span>
            <input type="date" value={periodTo} onChange={e => setPeriodToOverride(e.target.value || null)} />
          </div>
        </div>
        {(periodFromOverride || periodToOverride) && (
          <div style={{ fontSize: 12, color: ACCENT, marginBottom: 10 }}>
            Période modifiée manuellement — {fmtNum(monthsDisplay, 1)} mois (provision et nettoyage recalculés).{" "}
            <button className="btn btn-ghost" style={{ padding: "2px 8px", fontSize: 12 }} onClick={() => { setPeriodFromOverride(null); setPeriodToOverride(null); }}>
              Réinitialiser
            </button>
          </div>
        )}

        <div className="scrollx">
          <table className="tbl">
            <thead><tr><th></th><th>Conso.</th><th>Coût</th></tr></thead>
            <tbody>
              {!skipHeatingRow && (
                <tr>
                  <td>{unit.hasIsta ? "Chauffage / Eau chaude" : (mazoutNimyIsElecHeating ? "Mazout / Eau chaude sanitaire" : (building === "nimy" ? "Mazout / Chauffage / Eau chaude sanitaire (quote-part)" : "Mazout / Chauffage (quote-part)"))}</td>
                  <td>{unit.hasIsta ? "ISTA" : "—"}</td>
                  <td>
                    <input type="text" inputMode="decimal" placeholder="0"
                      value={chauffageTexte !== null ? chauffageTexte
                        : ((unit.hasIsta ? istaCost : (building === "nimy" ? (mazoutCost || mazoutNimyAuto) : mazoutCost)) || "")}
                      onChange={e => saisirChauffage(e.target.value)}
                      onBlur={quitterChauffage}
                      style={{ width: 90, textAlign: "right" }} />
                    {erreurChauffage && (
                      <div style={{ fontSize: 11, color: "#b91c1c", fontWeight: 600, marginTop: 2 }}>{erreurChauffage}</div>
                    )}
                  </td>
                </tr>
              )}
              <tr>
                <td>Électricité{elecAdj.mode !== "none" ? " *" : ""}{unit.elecOverrideZero ? " (n/a)" : ""}{elecConsoOverride !== null ? " (modifié)" : ""}</td>
                <td>
                  <input type="number" step="0.1" value={fmtNum(elecConso, 1).replace(/\s/g, "").replace(",", ".")}
                    onChange={e => setElecConsoOverride(e.target.value === "" ? 0 : parseFloat(e.target.value))}
                    style={{ width: 70, textAlign: "right" }} /> kWh
                  {elecConsoOverride !== null && (
                    <button className="btn btn-ghost" style={{ padding: "2px 6px", fontSize: 11, marginLeft: 4 }} onClick={() => setElecConsoOverride(null)}>↺</button>
                  )}
                </td>
                <td>{fmtEUR(elecCost)}</td>
              </tr>
              <tr>
                <td>Eau / Nettoyage{eauAdj.mode !== "none" ? " *" : ""}{eauConsoOverride !== null ? " (modifié)" : ""}</td>
                <td>
                  <input type="number" step="0.1" value={fmtNum(eauConso, 1).replace(/\s/g, "").replace(",", ".")}
                    onChange={e => setEauConsoOverride(e.target.value === "" ? 0 : parseFloat(e.target.value))}
                    style={{ width: 70, textAlign: "right" }} /> m³
                  {eauConsoOverride !== null && (
                    <button className="btn btn-ghost" style={{ padding: "2px 6px", fontSize: 11, marginLeft: 4 }} onClick={() => setEauConsoOverride(null)}>↺</button>
                  )}
                </td>
                <td>{fmtEUR(eauCost)}</td>
              </tr>
              {unit.sharedWaterPassage && (
                <tr style={{ fontSize: 12, color: MUTED }}>
                  <td>↳ dont eau froide (compteur passage ÷6)</td>
                  <td>{fmtNum(sharedWaterConso, 1)} m³</td>
                  <td>{fmtEUR(sharedWaterCost)}</td>
                </tr>
              )}
              <tr style={{ fontSize: 12, color: MUTED }}>
                <td>↳ dont nettoyage ({cleaningMonths} mois × {fmtEUR(unit.cleaningMonthly)})</td>
                <td>—</td>
                <td>{fmtEUR(cleaningCost)}</td>
              </tr>
            </tbody>
          </table>
        </div>

        {(elecAdj.mode !== "none" || eauAdj.mode !== "none") && (
          <div style={{ fontSize: 12, color: ACCENT, marginTop: 6 }}>
            * Valeur ajustée (voir Compteurs → Bilan) pour correspondre au compteur général de l'immeuble.
          </div>
        )}

        {elecInterval.length === 0 && eauInterval.length === 0 && !unit.elecOverrideZero && (
          <div style={{ fontSize: 12, color: ACCENT, marginTop: 8, padding: 8, background: PAPER, borderRadius: 8 }}>
            Ce logement n'a pas de compteur individuel électricité/eau. La période ci-dessus est calée sur 1 an par défaut
            ({fmtNum(monthsDisplay, 1)} mois) — ajustez les dates en modifiant la provision ou la quote-part mazout/chauffage
            manuellement{(ista && ista.invoices && ista.invoices.length) ? ", ou basez-vous sur les factures ISTA ci-dessous." : "."}
          </div>
        )}

        {ista && Array.isArray(ista.invoices) && ista.invoices.length > 0 && (
          <div style={{ fontSize: 12, color: MUTED, marginTop: 8, background: PAPER, borderRadius: 8, padding: "10px 12px" }}>
            <div style={{ fontWeight: 700, color: INK, fontSize: 13 }}>
              Factures ISTA de ce logement
              {referenceIsta(building, unitId) ? " — réf. " + referenceIsta(building, unitId) : ""}
            </div>
            <div style={{ marginTop: 4, lineHeight: 1.5 }}>
              Choisissez celle qui couvre la période du décompte ci-dessus. ISTA établit un décompte
              partiel quand un locataire part en cours d'année : il peut donc y en avoir deux la même année.
            </div>
            {ista.invoices.slice().reverse().map((inv, i) => (
              <div className="between" key={i}
                style={{ marginTop: 8, background: "#fff", borderRadius: 8, padding: "6px 10px" }}>
                <div style={{ fontSize: 13.5, color: INK }}>
                  <b>{fmtEUR(inv[1])}</b> — {fmtDate(inv[0])}
                </div>
                <button className="btn btn-accent" style={{ padding: "4px 12px", fontSize: 12 }}
                  onClick={() => reprendreFactureIsta(inv[1])}>
                  Reprendre
                </button>
              </div>
            ))}
            {istaRepris !== null && (
              <div style={{ marginTop: 8, color: INK, fontWeight: 600 }}>
                ✓ {fmtEUR(istaRepris)} reporté dans la case « dont ISTA » — vous pouvez encore le corriger.
              </div>
            )}
          </div>
        )}

        {unit.hasIsta && (!ista || !Array.isArray(ista.invoices) || ista.invoices.length === 0) && (
          <div style={{ fontSize: 12, color: MUTED, marginTop: 8 }}>
            Aucune facture ISTA enregistrée pour ce logement. Vous pouvez les saisir dans
            l'onglet <b>Compteurs</b>, sous le nom du logement.
          </div>
        )}

        <div style={{ marginTop: 12 }}>
          <span className="label">Provision de charges</span>
          <input type="text" inputMode="decimal" placeholder="0"
            value={provisionTexte !== null ? provisionTexte : (provision || "")}
            onChange={e => {
              const txt = e.target.value;
              setProvisionTexte(txt);
              const r = analyserNombre(txt);
              // Champ vidé : on retire le montant forcé, MAIS on garde le texte
              // vide affiché. Remettre provisionTexte à null ferait réapparaître
              // aussitôt la valeur calculée, rendant impossible d'effacer le
              // dernier chiffre (défaut signalé sur la v10).
              if (r.vide) { setErreurProvision(null); majAjustement({ provisionForcee: null }); return; }
              if (!r.valide) { setErreurProvision("Montant invalide."); return; }
              if (r.valeur < 0) { setErreurProvision("Le montant ne peut pas être négatif."); return; }
              setErreurProvision(null);
              majAjustement({ provisionForcee: r.valeur });
            }}
            onBlur={() => {
              // En quittant le champ laissé vide, on rend la main au calcul
              // automatique : la valeur calculée réapparaît.
              if (provisionTexte !== null && analyserNombre(provisionTexte).vide) setProvisionTexte(null);
            }} />
          {erreurProvision && (
            <div style={{ fontSize: 12, color: "#b91c1c", marginTop: 4, fontWeight: 600 }}>{erreurProvision}</div>
          )}
          {provisionForcee !== null ? (
            <div style={{ fontSize: 12, color: ACCENT, marginTop: 4 }}>
              Montant forcé —{" "}
              <button className="btn btn-ghost" style={{ padding: "2px 8px", fontSize: 12 }}
                onClick={() => { setProvisionTexte(null); setErreurProvision(null); majAjustement({ provisionForcee: null }); }}>rétablir le calcul</button>
            </div>
          ) : (
            <div style={{ fontSize: 12, color: MUTED, marginTop: 4 }}>
              {provisionMonths} mois{moisNonPayes > 0 ? ` − ${fmtNum(moisNonPayes, 1)} non payé(s)` : ""} = {fmtNum(moisFactures, 1)} × {fmtEUR(unit.provisionMonthly)} = <b>{fmtEUR(provision)}</b>
            </div>
          )}
        </div>

        <div style={{ marginTop: 10 }}>
          <span className="label">Mois non payés (demi-mois autorisés)</span>
          <input type="text" inputMode="decimal" placeholder="0"
            disabled={provisionForcee !== null}
            value={moisNonPayesTexte !== null ? moisNonPayesTexte : (moisNonPayes || "")}
            onChange={e => {
              const txt = e.target.value;
              setMoisNonPayesTexte(txt);
              const r = analyserNombre(txt);
              if (r.vide) { setErreurMoisNonPayes(null); majAjustement({ moisNonPayes: 0 }); return; }
              if (!r.valide) { setErreurMoisNonPayes("Valeur invalide."); return; }
              if (r.valeur < 0) { setErreurMoisNonPayes("Le nombre de mois ne peut pas être négatif."); return; }
              if (Math.round(r.valeur * 2) !== r.valeur * 2) { setErreurMoisNonPayes("Uniquement des demi-mois : 0 · 0,5 · 1 · 1,5 · 2…"); return; }
              if (r.valeur > provisionMonths) { setErreurMoisNonPayes(`La période ne compte que ${provisionMonths} mois.`); return; }
              setErreurMoisNonPayes(null);
              majAjustement({ moisNonPayes: r.valeur });
            }} />
          {erreurMoisNonPayes && (
            <div style={{ fontSize: 12, color: "#b91c1c", marginTop: 4, fontWeight: 600 }}>{erreurMoisNonPayes}</div>
          )}
          {provisionForcee !== null && (
            <div style={{ fontSize: 12, color: MUTED, marginTop: 4 }}>
              Sans effet tant qu'un montant est forcé ci-dessus.
            </div>
          )}
        </div>

        <div className="card" style={{ marginTop: 12, background: PAPER, border: "none" }}>
          <div className="between">
            <div>Total des charges</div>
            <MeterDigits value={fmtEUR(total)} />
          </div>
          <div className="between" style={{ marginTop: 6 }}>
            <div>Différence</div>
            <MeterDigits value={(diff < 0 ? "-" : "") + fmtEUR(Math.abs(diff))} cls={diff < 0 ? "red" : ""} />
          </div>
        </div>

        <div className="row" style={{ marginTop: 12 }}>
          <button className="btn btn-primary" onClick={openCurrentPreview}><FileText size={14} /> Voir le décompte</button>
          <button className="btn btn-accent" onClick={archive}><Save size={14} /> Archiver cette période</button>
        </div>

        {blocRemboursement}

      </div>

      <div className="card">
        <div style={{ fontWeight: 700, marginBottom: 8 }}>
          <HistoryIcon size={14} style={{ verticalAlign: -2, marginRight: 4 }} />
          Archives ({archives.length})
        </div>
        {archives.length === 0 && <div style={{ fontSize: 13, color: MUTED }}>Aucune période archivée pour ce logement.</div>}
        {archives.slice().reverse().map((a, i) => {
          const realIndex = archives.length - 1 - i;
          return (
            <div key={i} className="between" style={{ padding: "8px 0", borderTop: `1px solid ${LINE}` }}>
              <div>
                <div style={{ fontWeight: 600, fontSize: 14 }}>{fmtDate(a.from)} → {fmtDate(a.to)}</div>
                <div style={{ fontSize: 12, color: MUTED }}>{a.tenant} · Total {fmtEUR(a.total)} · Diff. <span style={{ color: a.diff < 0 ? RED : TEXT, fontWeight: 700 }}>{(a.diff < 0 ? "-" : "") + fmtEUR(Math.abs(a.diff))}</span></div>
              </div>
              <div className="row" style={{ gap: 6 }}>
                <button className="btn btn-ghost" onClick={() => openArchivedPreview(a)}><FileText size={14} /></button>
                <button className="btn btn-ghost" style={{ color: RED }} onClick={() => {
                  if (window.confirm(`Supprimer l'archive du ${fmtDate(a.from)} → ${fmtDate(a.to)} (${a.tenant}) ?`)) {
                    setData(prev => {
                      const next = JSON.parse(JSON.stringify(prev));
                      next.archives[building][unitId].splice(realIndex, 1);
                      return next;
                    });
                  }
                }}><X size={14} /></button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================
   SEARCH VIEW
   ============================================================ */
function SearchView({ data, onGo }) {
  const [q, setQ] = useState("");
  const results = useMemo(() => {
    const term = q.trim().toLowerCase();
    const out = [];
    data.buildings.forEach(b => {
      b.units.forEach(u => {
        const names = [u.tenant, ...(u.history || []).map(h => h.tenant)].filter(Boolean);
        const archives = (data.archives?.[b.id]?.[u.id]) || [];
        archives.forEach(a => names.push(a.tenant));
        const haystack = [b.name, u.name, ...names].join(" ").toLowerCase();
        if (term === "" || haystack.includes(term)) {
          out.push({ building: b, unit: u, names: [...new Set(names)] });
        }
      });
    });
    return out;
  }, [q, data]);

  return (
    <div>
      <div className="card">
        <input placeholder="Rechercher un immeuble, un logement ou un locataire…" value={q} onChange={e => setQ(e.target.value)} />
      </div>
      {results.map(r => (
        <div className="card" key={r.building.id + r.unit.id}>
          <div className="between">
            <div>
              <div style={{ fontWeight: 700 }}>{r.unit.name} <span style={{ color: MUTED, fontWeight: 400 }}>· {r.building.name}</span></div>
              <div style={{ fontSize: 13, color: MUTED }}>
                {r.names.length ? r.names.join(", ") : "Aucun locataire enregistré"}
              </div>
            </div>
          </div>
          <div className="row" style={{ marginTop: 8 }}>
            <button className="btn btn-ghost" onClick={() => onGo(r.building.id, "buildings")}>Logement</button>
            <button className="btn btn-ghost" onClick={() => onGo(r.building.id, "meters")}>Compteurs</button>
            <button className="btn btn-ghost" onClick={() => onGo(r.building.id, "decomptes")}>Décomptes</button>
          </div>
        </div>
      ))}
      {results.length === 0 && <div style={{ fontSize: 13, color: MUTED, textAlign: "center", marginTop: 30 }}>Aucun résultat.</div>}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
