/* ---- localStorage-based shim for window.storage (Claude artifact API) ---- */
if (!window.storage) {
  window.storage = {
    get: async (key) => {
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v, shared: false };
    },
    set: async (key, value) => {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    delete: async (key) => {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    list: async (prefix) => {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!prefix || k.startsWith(prefix)) keys.push(k);
      }
      return { keys };
    },
  };
}

/* ---- minimal inline SVG line chart (replaces recharts) ---- */
function EvolutionChart({ readings, dataKey, color, unitLabel }) {
  // Ce Hook doit rester AVANT tout return anticipe (regles des Hooks React).
  const [hover, setHover] = useState(null);
  const data = (readings || []).map(r => ({
    date: r[0], year: r[0] ? r[0].slice(0, 7) : "", value: dataKey === "cost" ? r[4] : r[3],
  })).filter(d => d.date);
  if (data.length < 2) return <div style={{ fontSize: 13, color: MUTED }}>Pas assez de données pour un graphique.</div>;

  const W = 320, H = 160, PAD = 30;
  const values = data.map(d => d.value);
  const minV = Math.min(0, ...values);
  const maxV = Math.max(...values, minV + 1);
  const xStep = (W - PAD * 2) / (data.length - 1);
  const yScale = v => H - PAD - ((v - minV) / (maxV - minV)) * (H - PAD * 2);
  const points = data.map((d, i) => `${PAD + i * xStep},${yScale(d.value)}`).join(" ");

  return (
    <div style={{ width: "100%" }}>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={180} preserveAspectRatio="none"
        onTouchStart={(e) => {
          const rect = e.currentTarget.getBoundingClientRect();
          const x = (e.touches[0].clientX - rect.left) / rect.width * W;
          const idx = Math.round((x - PAD) / xStep);
          if (idx >= 0 && idx < data.length) setHover(idx);
        }}>
        <line x1={PAD} y1={H - PAD} x2={W - PAD} y2={H - PAD} stroke={LINE} />
        <line x1={PAD} y1={PAD} x2={PAD} y2={H - PAD} stroke={LINE} />
        <text x={2} y={PAD + 4} fontSize="9" fill={MUTED}>{fmtNum(maxV, 0)}</text>
        <text x={2} y={H - PAD + 4} fontSize="9" fill={MUTED}>{fmtNum(minV, 0)}</text>
        <polyline points={points} fill="none" stroke={color} strokeWidth="2" />
        {data.map((d, i) => (
          <circle key={i} cx={PAD + i * xStep} cy={yScale(d.value)} r={hover === i ? 4 : 2.5} fill={color} />
        ))}
        {hover !== null && (
          <text x={Math.min(W - PAD - 40, Math.max(PAD, PAD + hover * xStep - 20))} y={PAD - 6} fontSize="10" fontWeight="700" fill={TEXT}>
            {data[hover].year} · {dataKey === "cost" ? fmtEUR(data[hover].value) : fmtNum(data[hover].value, 0) + " " + unitLabel}
          </text>
        )}
      </svg>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9, color: MUTED, padding: "0 4px" }}>
        <span>{data[0].year}</span>
        <span>{data[data.length - 1].year}</span>
      </div>
    </div>
  );
}

/* ============================================================
   MINIMAL, SELF-CONTAINED .DOCX BUILDER (real OOXML via JSZip)
   ============================================================ */
function xmlEscape(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&apos;");
}

// twips: 1440 per inch
function docxPara(text, opts = {}) {
  const { bold, italic, color, size, align, spacingAfter } = opts;
  const rPr = `${bold ? "<w:b/>" : ""}${italic ? "<w:i/>" : ""}${color ? `<w:color w:val="${color}"/>` : ""}${size ? `<w:sz w:val="${size}"/><w:szCs w:val="${size}"/>` : ""}`;
  const pPr = `${align ? `<w:jc w:val="${align}"/>` : ""}${spacingAfter !== undefined ? `<w:spacing w:after="${spacingAfter}"/>` : ""}`;
  // text may contain simple <b>...</b> markers for inline bold spans
  const runs = String(text).split(/(<b>.*?<\/b>)/g).filter(Boolean).map(part => {
    const isBold = part.startsWith("<b>");
    const clean = xmlEscape(part.replace(/<\/?b>/g, ""));
    const runPr = `${(bold || isBold) ? "<w:b/>" : ""}${italic ? "<w:i/>" : ""}${color ? `<w:color w:val="${color}"/>` : ""}${size ? `<w:sz w:val="${size}"/><w:szCs w:val="${size}"/>` : ""}`;
    return `<w:r>${runPr ? `<w:rPr>${runPr}</w:rPr>` : ""}<w:t xml:space="preserve">${clean}</w:t></w:r>`;
  }).join("");
  return `<w:p>${pPr ? `<w:pPr>${pPr}</w:pPr>` : ""}${runs || `<w:r>${rPr ? `<w:rPr>${rPr}</w:rPr>` : ""}<w:t xml:space="preserve"></w:t></w:r>`}</w:p>`;
}

function docxCell(text, opts = {}) {
  const { bold, color, bg, align = "center", width } = opts;
  const shd = bg ? `<w:shd w:val="clear" w:color="auto" w:fill="${bg}"/>` : "";
  const tcW = width ? `<w:tcW w:w="${width}" w:type="dxa"/>` : `<w:tcW w:w="0" w:type="auto"/>`;
  const vAlign = `<w:vAlign w:val="center"/>`;
  return `<w:tc><w:tcPr>${tcW}${shd}${vAlign}</w:tcPr>${docxPara(text, { bold, color, align, size: 18 })}</w:tc>`;
}

function docxRow(cells) {
  return `<w:tr>${cells.join("")}</w:tr>`;
}

function docxTable(rows, opts = {}) {
  const { widthPct = 5000, nCols = 1 } = opts;
  const colWidth = Math.floor(9000 / nCols);
  const gridCols = Array.from({ length: nCols }, () => `<w:gridCol w:w="${colWidth}"/>`).join("");
  return `<w:tbl><w:tblPr><w:tblW w:w="${widthPct}" w:type="pct"/><w:tblBorders>
    <w:top w:val="single" w:sz="4" w:color="999999"/><w:left w:val="single" w:sz="4" w:color="999999"/>
    <w:bottom w:val="single" w:sz="4" w:color="999999"/><w:right w:val="single" w:sz="4" w:color="999999"/>
    <w:insideH w:val="single" w:sz="4" w:color="999999"/><w:insideV w:val="single" w:sz="4" w:color="999999"/>
  </w:tblBorders><w:tblLayout w:type="autofit"/></w:tblPr><w:tblGrid>${gridCols}</w:tblGrid>${rows.join("")}</w:tbl>`;
}

/* ============================================================================
   ===== MODULE REMBOURSEMENT — DÉBUT ========================================
   Bloc volontairement isole : il n'appelle aucune fonction du decompte et
   n'en modifie aucune. Il reutilise seulement les briques deja globales
   (docxTable/docxRow/docxCell/docxPara, fmtEUR, cleanPath, WEBHOOK_URL).
   Calcul : total = garantie − retard loyer − retard assurance + decompte − degats

   Sens des grandeurs (Gestion Loyers v85 et suivantes) :
     garantie        <- garantieEncaissee : ce qui a ete REELLEMENT recu du
                        locataire, et non garantieMontant (le montant du au
                        contrat). Repli sur garantieMontant pour les anciens
                        fichiers remboursements.json.
     retardAssurance <- restant du d'assurance, et non plus la prime entiere.
     decompte        <- valeur SIGNEE, donc TOUJOURS ADDITIONNEE :
                        positive quand le bailleur doit au locataire
                        (trop-percu de provisions), negative quand le locataire
                        doit des charges. Ne jamais inverser ce signe.
   Le decompte garde son signe (positif = du au locataire).
   ============================================================================ */

// Les memes champs que le remboursement ordinaire, SANS le decompte.
const CHAMPS_AUTRE_IMMEUBLE = [
  { cle: "garantie", libelle: "Garantie locative (€)", negatifAutorise: false },
  { cle: "retardLoyer", libelle: "Retard de loyer (€)", negatifAutorise: false },
  { cle: "retardAssurance", libelle: "Retard d'assurance (€)", negatifAutorise: false },
  { cle: "degats", libelle: "Dégâts locatifs (€)", negatifAutorise: false },
];

const CHAMPS_REMBOURSEMENT = [
  { cle: "garantie", libelle: "Garantie locative (€)", negatifAutorise: false },
  { cle: "retardLoyer", libelle: "Retard de loyer (€)", negatifAutorise: false },
  { cle: "retardAssurance", libelle: "Retard d'assurance (€)", negatifAutorise: false },
  { cle: "decompte", libelle: "Décompte (€)", negatifAutorise: true },
  { cle: "degats", libelle: "Dégâts locatifs (€)", negatifAutorise: false },
];

// Le decompte vaut null tant qu'il n'a pas ete force a la main : on prend
// alors la valeur calculee par l'ecran.
function decompteEffectif(remb, decompteCalcule) {
  return (remb && remb.decompte !== null && remb.decompte !== undefined) ? remb.decompte : decompteCalcule;
}

function totalRemboursement(remb, decompteCalcule) {
  const r = remb || {};
  const total = (r.garantie || 0)
    - (r.retardLoyer || 0)
    - (r.retardAssurance || 0)
    + decompteEffectif(r, decompteCalcule)
    - (r.degats || 0);
  return Math.round(total * 100) / 100;
}

// Immeubles du fichier qui ne sont PAS geres par cette application.

// Regroupe les locataires de ces quatre immeubles, dans l'ordre du fichier.
function logementsAutresImmeubles(contenu) {
  const parImmeuble = {};
  for (const l of ((contenu && contenu.locataires) || [])) {
    if (!AUTRES_IMMEUBLES.includes(l.immeubleId)) continue;
    if (!l.locataire) continue;                 // logement inoccupe : rien a rembourser
    if (!parImmeuble[l.immeubleId]) parImmeuble[l.immeubleId] = [];
    parImmeuble[l.immeubleId].push(l);
  }
  return parImmeuble;
}

// Dossier racine configure dans le module OneDrive du scenario Make.com
// (champ Folder = "SAUVEGARDE DECOMPTES/" + folderPath, connexion
// « OneDrive Charges (S.A. SAMADHI) », emplacement My Drive).
// L'application ne connait que la partie relative ; ce prefixe sert UNIQUEMENT
// a afficher a l'utilisateur le chemin complet ou retrouver son document.
// SI LE CHAMP FOLDER EST MODIFIE DANS MAKE, CHANGER CETTE CONSTANTE AUSSI.
const DOSSIER_RACINE_DOCUMENTS = "SAUVEGARDE DECOMPTES";

// Chemin complet, lisible, tel qu'il apparait dans OneDrive.
function cheminLisible(folderPath, filename) {
  return DOSSIER_RACINE_DOCUMENTS + " / " + folderPath.split("/").join(" / ") + " / " + filename;
}

// Meme dossier et meme action Make que les decomptes : SAUVEGARDE DECOMPTES,
// annee / immeuble / logement. Aucune modification du scenario Make.
async function saveAutreOneDrive(immeubleNom, uniteNom, locataire, montants, total) {
  const year = String(new Date().getFullYear());
  const immeubleClean = cleanPath(immeubleNom);
  const uniteClean = cleanPath(uniteNom);
  const locataireClean = cleanPath(locataire || "Locataire");
  const folderPath = year + "/" + immeubleClean + "/" + uniteClean;
  const filename = "Remboursement_" + immeubleClean + "_" + uniteClean + "_" + locataireClean + "_" + year + ".docx";
  const blob = await buildAutreBlob(immeubleNom, uniteNom, locataire, montants, total);
  const base64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
  const response = await fetch(WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "save_decompte_auto", folderPath, filename, data: base64 })
  });
  if (!response.ok) throw new Error("Erreur Make.com : " + response.status);
  return { folderPath, filename };
}

// Meme dossier et meme action Make que le decompte (save_decompte_auto) :
// AUCUNE modification du scenario Make n'est necessaire, seul le nom change.
async function saveRemboursementOneDrive(buildingName, unitName, tenantName, period, remb, dec, total) {
  const parts = period.split(" - ");
  const dateFin = parts[parts.length - 1].trim();
  const year = dateFin.slice(-4);
  const buildingClean = cleanPath(buildingName);
  const unitClean = cleanPath(unitName);
  const tenantClean = cleanPath(tenantName);
  const folderPath = year + "/" + buildingClean + "/" + unitClean;
  const filename = "Remboursement_" + buildingClean + "_" + unitClean + "_" + tenantClean + "_" + year + ".docx";
  const blob = await buildRemboursementBlob(buildingName, unitName, tenantName, period, remb, dec, total);
  const base64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
  const response = await fetch(WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "save_decompte_auto", folderPath, filename, data: base64 })
  });
  if (!response.ok) throw new Error("Erreur Make.com : " + response.status);
  return { folderPath, filename };
}

// Champ defini AU NIVEAU DU MODULE : le definir dans le composant parent le
// recreerait a chaque frappe et ferait perdre le focus.
/* ---------------------------------------------------------------------------
   COMPARAISON AVEC GESTION LOYERS
   Logique d'appariement REPRISE TELLE QUELLE de graph-veros-scan.js (Gestion
   Loyers) : on ne compare pas des mots, on reduit chaque libelle a un TYPE et
   un NUMERO. "APPART 3 GUIRLANDE" et "Appartement 3" donnent tous deux
   ETAGE/3, "APPART. RDC GUIRLANDE" et "RDC Arriere" donnent RDC.
   Verifie sur les vraies donnees : 35 appariements sur 35.
   --------------------------------------------------------------------------- */

// Identifiants d'immeuble differents entre les deux applications.
const IMMEUBLE_GESTION_LOYERS = { "petite-guirlande": "ptg", "biche": "biche", "nimy": "nimy" };

function normaliserNomUnite(s) {
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/\s+/g, " ").trim();
}

function extraireTypeEtNumero(nom) {
  const n = normaliserNomUnite(nom);
  if (/COMMERCIAL/.test(n)) return { type: "RDC_COMMERCIAL", num: null };
  if (/\bRDC\b/.test(n) || /REZ[\s-]*DE[\s-]*CHAUSSEE/.test(n)) return { type: "RDC", num: null };
  if (/GARAGE/.test(n)) return { type: "GARAGE", num: null };
  if (/DUPLEX/.test(n)) return { type: "DUPLEX", num: null };
  let m = n.match(/STUDIO\s*(\d+)/);
  if (m) return { type: "STUDIO", num: parseInt(m[1], 10) };
  m = n.match(/(\d+)\s*(ER|EME|E)?\s*ETAGE/);
  if (m) return { type: "ETAGE", num: parseInt(m[1], 10) };
  m = n.match(/APPART(?:EMENT)?\.?\s*(\d+)/);
  if (m) return { type: "ETAGE", num: parseInt(m[1], 10) }; // APPART n et ETAGE n : meme logement
  if (/\bAPPARTEMENT\b/.test(n) || /\bAPPART\.?\b/.test(n)) return { type: "APPART", num: null };
  return { type: null, num: null };
}

const cleAppariement = (immeubleId, libelleUnite) => {
  const t = extraireTypeEtNumero(libelleUnite);
  return immeubleId + "|" + t.type + "|" + t.num;
};

// Lit remboursements.json via la route Make dediee. Leve une exception en cas
// d'echec : l'appelant affiche l'erreur, il ne se rabat JAMAIS sur autre chose.
async function lireRemboursementsGestionLoyers() {
  const controller = new AbortController();
  const minuteur = setTimeout(() => controller.abort(), 15000);
  try {
    const reponse = await fetch(WEBHOOK_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "read_remboursements" }), signal: controller.signal,
    });
    if (!reponse.ok) throw new Error("Make.com a répondu " + reponse.status);
    const texte = (await reponse.text()).trim();
    if (!texte) throw new Error("Fichier remboursements.json introuvable ou vide sur OneDrive.");
    const contenu = JSON.parse(texte);
    if (!contenu || !Array.isArray(contenu.locataires)) throw new Error("Le fichier reçu n'a pas le format attendu.");
    return contenu;
  } finally {
    clearTimeout(minuteur);
  }
}

// Etat d'une correspondance entre un logement et une entree du fichier.
// "sur" : les deux noms concordent (ou l'un des deux est absent) -> rien a demander.
// "doute" : les noms se ressemblent sans etre identiques -> on DEMANDE a Gerard.
// "different" : locataires sans rapport -> vrai changement, aucune question.
const SANS_LOCATAIRE = ["INOCCUPE", "VACANT", "LIBRE", "VIDE"];

function comparerNoms(nomApp, nomFichier) {
  const nettoyer = (x) => {
    const t = normaliserNomUnite(x || "").replace(/[^A-Z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
    return SANS_LOCATAIRE.includes(t) ? "" : t;       // « Inoccupé » n'est pas un nom
  };
  const a = nettoyer(nomApp), b = nettoyer(nomFichier);
  if (!a && !b) return "sur";                         // vide des deux cotes : rien a comparer
  if (!a || !b) return "doute";                       // un seul cote renseigne : on demande
  if (a.replace(/ /g, "") === b.replace(/ /g, "")) return "sur";
  const motsA = a.split(" ").filter(Boolean);
  const motsB = b.split(" ").filter(Boolean);
  // memes mots dans un autre ordre : DELMOTE Ema / Ema DELMOTE
  const triA = motsA.slice().sort().join(" "), triB = motsB.slice().sort().join(" ");
  if (triA === triB) return "doute";
  // au moins un mot commun d'au moins 4 lettres : orthographe voisine, meme famille,
  // co-locataire disparu... bref, tout ce qui merite une question plutot qu'un verdict.
  const communs = motsA.filter(m => m.length >= 4 && motsB.includes(m));
  if (communs.length > 0) return "doute";
  // orthographe a une lettre pres sur le mot le plus long (KOZLENKO / KOSLENKO)
  const plusLong = t => t.reduce((x, y) => (y.length > x.length ? y : x), "");
  const la = plusLong(motsA), lb = plusLong(motsB);
  if (la.length >= 5 && lb.length >= 5 && Math.abs(la.length - lb.length) <= 1) {
    let differences = 0;
    const n = Math.max(la.length, lb.length);
    for (let i = 0, j = 0; i < n && differences <= 1; i++, j++) {
      if (la[i] !== lb[j]) {
        differences++;
        if (la.length > lb.length) j--; else if (lb.length > la.length) i--;
      }
    }
    if (differences <= 1) return "doute";
  }
  return "different";
}

const cleDecision = (immeubleId, unitId) => immeubleId + "|" + unitId;

// Duree au-dela de laquelle on relit remboursements.json. Ce n'est PAS un
// minuteur : rien n'est declenche tout seul, on verifie seulement l'age de la
// derniere lecture au moment ou l'utilisateur ouvre le panneau.
const FRAICHEUR_LISTE_MS = 5 * 60 * 1000;

// Construit, pour un immeuble donne, la liste comparee logement par logement.
// Liste complete des 50 logements : on part du FICHIER (7 immeubles) et on
// rattache, quand il existe, le logement correspondant de l'application.
function comparerTousLesLogements(data, contenu) {
  const parImmeuble = {};
  // Une LISTE par cle, jamais une seule valeur : si deux logements se ramenaient
  // a la meme cle, aucun ne serait perdu en silence.
  const appParCle = {};
  for (const b of (data.buildings || [])) {
    for (const u of b.units) {
      const k = cleAppariement(b.id, u.name);
      if (!appParCle[k]) appParCle[k] = [];
      appParCle[k].push({ unite: u, immeubleId: b.id, immeubleNom: b.name });
    }
  }
  for (const l of (contenu.locataires || [])) {
    const bid = IMMEUBLE_GESTION_LOYERS[l.immeubleId] || null;   // null = immeuble absent ici
    const liste = bid ? appParCle[cleAppariement(bid, l.unite)] : null;
    const app = (liste && liste.length) ? liste[0] : null;
    const nomImmeuble = (app && app.immeubleNom) || l.immeuble || l.immeubleId;
    if (!parImmeuble[nomImmeuble]) parImmeuble[nomImmeuble] = [];
    parImmeuble[nomImmeuble].push({
      gl: l,
      unite: app ? app.unite : null,
      immeubleId: bid,
      etat: app ? comparerNoms(app.unite.tenant, l.locataire) : "sur",
      dansApp: !!app,
    });
    if (app) liste.shift();                    // on consomme UN logement, pas toute la cle
  }
  // logements connus de l'application mais absents du fichier (y compris ceux
  // qui partageaient une cle avec un autre : plus rien ne se perd)
  const absentsDuFichier = [].concat(...Object.values(appParCle));
  return { parImmeuble, absentsDuFichier };
}

function comparerAvecGestionLoyers(building, unites, contenu) {
  const parCle = {};
  const nonApparies = [];
  for (const l of (contenu.locataires || [])) {
    const bid = IMMEUBLE_GESTION_LOYERS[l.immeubleId];
    if (!bid) continue;                    // immeuble absent de cette application
    if (bid !== building) continue;        // autre immeuble que celui affiche
    const k = cleAppariement(bid, l.unite);
    if (parCle[k]) nonApparies.push(l);    // deux entrees pour le meme logement
    else parCle[k] = l;
  }
  const utilisees = new Set();
  const lignes = unites.map(u => {
    const k = cleAppariement(building, u.name);
    const gl = parCle[k];
    if (gl) utilisees.add(k);
    return { unite: u, gl: gl || null };
  });
  for (const k of Object.keys(parCle)) {
    if (!utilisees.has(k)) nonApparies.push(parCle[k]);
  }
  return { lignes, nonApparies };
}

function ChampRemboursement({ libelle, texte, valeurAffichee, onTexte, onSortie, erreur }) {
  return (
    <div style={{ marginTop: 10 }}>
      <span className="label">{libelle}</span>
      <input type="text" inputMode="decimal" placeholder="0"
        value={texte !== null && texte !== undefined ? texte : (valeurAffichee || "")}
        onChange={e => onTexte(e.target.value)}
        onBlur={onSortie} />
      {erreur && (
        <div style={{ fontSize: 12, color: "#b91c1c", marginTop: 4, fontWeight: 600 }}>{erreur}</div>
      )}
    </div>
  );
}

const fmtEUR = (n) => {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return n.toLocaleString("fr-BE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
};
const fmtNum = (n, d = 0) => {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return n.toLocaleString("fr-BE", { minimumFractionDigits: d, maximumFractionDigits: d });
};
const fmtDate = (iso) => {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
};
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const todayISO = () => new Date().toISOString().slice(0, 10);

const TYPE_ICON = { elec: Zap, eau: Droplet, gaz: Flame };

function deriveTariffs(meters, building) {
  const t = { eau: 6.5, elecJour: 0.6, elecNuit: 0.6, gaz: 0.6, studentEau: 6.5, studentElec: 0.6 };
  meters.filter(m => m.building === building).forEach(m => {
    const last = m.readings[m.readings.length - 1];
    if (!last) return;
    const rate = last[2];
    if (m.type === "eau" && rate) t.eau = rate;
    if (m.type === "elec" && m.subtype !== "nuit" && rate) t.elecJour = rate;
    if (m.type === "elec" && m.subtype === "nuit" && rate) t.elecNuit = rate;
    if (m.type === "gaz" && rate) t.gaz = rate;
  });
  t.studentEau = t.eau;
  t.studentElec = t.elecJour;
  return t;
}

function lastInterval(readings) {
  if (!readings || readings.length < 2) return null;
  const prev = readings[readings.length - 2];
  const last = readings[readings.length - 1];
  return {
    fromDate: prev[0], toDate: last[0], fromIndex: prev[1], toIndex: last[1],
    rate: last[2], conso: last[3], cost: last[4], days: last[5],
  };
}

function unitMeters(meters, building, unitId, scope = "unit") {
  return meters.filter(m => m.building === building && m.scope === scope && m.unit === unitId);
}

function decompteFilename(buildingName, unitName, period, ext) {
  return `Decompte_${buildingName}_${unitName}_${period.replace(/[\\/ ]/g, "-")}.${ext}`
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^A-Za-z0-9._-]/g, "_");
}

async function buildDecompteBlob(buildingName, unitName, tenantName, period, lines, totals, html) {
  // Real .docx via our hand-rolled OOXML builder (standalone build, JSZip loaded).
  if (typeof window !== "undefined" && window.JSZip && typeof buildDocxBlob === "function") {
    try {
      const blob = await buildDocxBlob(buildingName, unitName, tenantName, period, lines, totals);
      return { blob, ext: "docx", mime: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" };
    } catch (e) {
      // fall through to legacy HTML-as-.doc
    }
  }
  return { blob: new Blob(["\ufeff", html], { type: "application/msword" }), ext: "doc", mime: "application/msword" };
}

// Primary: native share sheet (works in Safari + standalone PWA on iOS/iPadOS,
// lets the person save the file to Files, AirDrop it, or open it in Word).
async function shareDecompteDoc(buildingName, unitName, tenantName, period, lines, totals) {
  const html = buildDecompteHtml(buildingName, unitName, tenantName, period, lines, totals);
  const { blob, ext, mime } = await buildDecompteBlob(buildingName, unitName, tenantName, period, lines, totals, html);
  const filename = decompteFilename(buildingName, unitName, period, ext);
  const file = new File([blob], filename, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      return true;
    } catch (e) {
      return false; // user cancelled, or share failed
    }
  }
  return false;
}

// Fallback: classic blob download (works in desktop browsers; unreliable in iOS standalone apps).
// Génère un vrai PDF téléchargeable à partir de l'aperçu du décompte tel
// qu'affiché à l'écran (capture visuelle), sans dépendre du moteur
// d'impression du navigateur — évite les soucis de mise en page/pages
// vides constatés avec window.print().
async function downloadDecomptePdf(buildingName, unitName, period) {
  const el = document.getElementById("decompte-capture-area");
  if (!el || !window.html2canvas || !window.jspdf) return;
  const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
  const imgData = canvas.toDataURL("image/jpeg", 0.95);
  const pageWidthMM = 210;
  const pageHeightMM = (canvas.height * pageWidthMM) / canvas.width;
  const doc = new window.jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: [pageWidthMM, pageHeightMM] });
  doc.addImage(imgData, "JPEG", 0, 0, pageWidthMM, pageHeightMM);
  doc.save(decompteFilename(buildingName, unitName, period, "pdf"));
}

async function downloadDecompteDoc(buildingName, unitName, tenantName, period, lines, totals) {
  const html = buildDecompteHtml(buildingName, unitName, tenantName, period, lines, totals);
  const { blob, ext } = await buildDecompteBlob(buildingName, unitName, tenantName, period, lines, totals, html);
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = decompteFilename(buildingName, unitName, period, ext);
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}


// Sauvegarde automatique OneDrive via Make.com
function cleanPath(str) {
  return (str || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, "_")
    .replace(/[^A-Za-z0-9_-]/g, "");
}

async function saveDecompteOneDrive(buildingName, unitName, tenantName, period, lines, totals) {
  const parts = period.split(" - ");
  const dateFin = parts[parts.length - 1].trim();
  const year = dateFin.slice(-4);
  const buildingClean = cleanPath(buildingName);
  const unitClean = cleanPath(unitName);
  const tenantClean = cleanPath(tenantName);
  const folderPath = year + "/" + buildingClean + "/" + unitClean;
  const filename = "Decompte_" + buildingClean + "_" + unitClean + "_" + tenantClean + "_" + year + ".docx";
  const html = buildDecompteHtml(buildingName, unitName, tenantName, period, lines, totals);
  const { blob } = await buildDecompteBlob(buildingName, unitName, tenantName, period, lines, totals, html);
  const base64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
  const response = await fetch(WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "save_decompte_auto", folderPath, filename, data: base64 })
  });
  if (!response.ok) throw new Error("Erreur Make.com : " + response.status);
  return { folderPath, filename };
}

  const diffColor = totals.diff < 0 ? RED : TEXT;
  const diffText = (totals.diff < 0 ? "-" : "") + fmtEUR(Math.abs(totals.diff));
  const [shareState, setShareState] = useState("idle"); // idle | sharing | unsupported

  const canShareFiles = typeof navigator !== "undefined" && !!navigator.canShare;

  const handleShare = async () => {
    setShareState("sharing");
    const ok = await onShareDoc();
    setShareState(ok ? "idle" : "unsupported");
  };

  const [saveOneDriveState, setSaveOneDriveState] = React.useState("idle"); // idle | saving | ok | err
  const handleSaveOneDrive = async () => {
    setSaveOneDriveState("saving");
    try {
      await onSaveDecompteOneDrive();
      setSaveOneDriveState("ok");
      setTimeout(() => setSaveOneDriveState("idle"), 3000);
    } catch(e) {
      setSaveOneDriveState("err");
      setTimeout(() => setSaveOneDriveState("idle"), 4000);

        <button className="btn" onClick={onDownloadDoc} style={{ background: "#4f6ef7", color: "#fff", border: "none" }}><Download size={15} /> Télécharger le .docx</button>

        <button className="btn" onClick={() => window.open('https://gerar04577.github.io/ENVOI-DECOMPTES/charges-envoi.html', '_blank')} style={{ background: "linear-gradient(135deg,#4f6ef7,#7c3aed)", color: "#fff", border: "none" }}>
          📬 Envoyer

        <button className="btn" onClick={() => window.open('https://gerar04577.github.io/CHARGES-IMMEUBLES-/remboursement.html', '_blank')} style={{ background: "linear-gradient(135deg,#f0abfc,#c084fc)", color: "#fff", border: "none" }}>
          💶 Remboursement

      </div>
      {shareState === "unsupported" && (
        <div className="no-print" style={{ fontSize: 12, color: MUTED, marginBottom: 10, padding: 8, background: PAPER, borderRadius: 8 }}>
          Le partage direct n'est pas disponible sur cet appareil/navigateur — utilisez "Imprimer / Enregistrer en PDF" ci-dessus,
          ou <button className="btn btn-ghost" style={{ padding: "2px 8px", fontSize: 12 }} onClick={onDownloadDoc}>essayez le téléchargement</button>.

          {[b.name, unit.name, tenant].map((t, i) => (

      <p className="decompte-explain" style={{ fontSize: 13, lineHeight: 1.5, margin: "0 0 12px 0" }}>
        <b>Veuillez trouver ci-après le tableau reprenant vos consommations d'énergie (mazout, gaz et électricité) et d'eau pour le(s) mois passé(s).</b>{" "}
        Nous attirons votre attention sur la colonne <b>« différence »</b> qui montre, en cas de valeur négative,
        le dépassement de vos consommations par rapport à vos provisions de charges.

        Un solde positif est en faveur du locataire.

/* ============================================================
   APP ROOT
   ============================================================ */
function App() {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [building, setBuilding] = useState("biche");
  const [loaded, setLoaded] = useState(false);
  // Le message vert ne doit apparaitre QU'APRES un import OneDrive reellement
  // confirme. Il valait "true" des le premier rendu : il s'affichait donc meme
  // quand rien n'avait ete charge (incident du 19/08).
  const [loadMsg, setLoadMsg] = useState(false);
  const [blocage, setBlocage] = useState(null); // motif du blocage, null = pas de blocage
  const [rechargement, setRechargement] = useState(0); // incremente par "Réessayer"
  const [saveReminder, setSaveReminder] = useState(false);
  const isInitialLoad = React.useRef(true);

  // Rappel de sauvegarde toutes les 10 minutes
  React.useEffect(() => {
    const interval = setInterval(() => {
      setSaveReminder(true);
      setTimeout(() => setSaveReminder(false), 10000);
    }, 10 * 60 * 1000);
    return () => clearInterval(interval);
  }, []);

  // Ensure a sensible mobile viewport (the standalone HTML build already sets
  // this in <head>; this is a harmless fallback when run inside an embedded
  // preview that doesn't provide one).
  useEffect(() => {
    let meta = document.querySelector('meta[name="viewport"]');
    if (!meta) {
      meta = document.createElement("meta");
      meta.name = "viewport";
      meta.setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover");
      document.head.appendChild(meta);
    }
  }, []);

  useEffect(() => {
    (async () => {
      try {
        // ?reset vide seulement le cache local de cet appareil.
        // Il ne charge PLUS les donnees figees dans le fichier (SEED) : cela
        // ferait travailler sur des donnees perimees, puis les propagerait.
        if (window.location.search.includes("reset")) {
          await window.storage.delete("charges-data").catch(() => {});
        }
        // 1) Essayer OneDrive d'abord
        try {
          const controller = new AbortController();
          setTimeout(() => controller.abort(), 10000);
          const response = await fetch(WEBHOOK_URL, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "import" }),
            signal: controller.signal
          });
          if (response.ok) {
            const text = await response.text();
            const decoded = decodeURIComponent(escape(atob(text.trim())));
            const parsed = garantirStructure(JSON.parse(decoded));
            if (parsed.buildings && parsed.meters) {
              // un import n'est pas une modification : ne pas declencher
              // "modifications en attente" juste apres un Réessayer reussi
              isInitialLoad.current = true;
              definirSnapshotOneDrive(parsed); // reference pour detecter un conflit plus tard
              setData(parsed);
              await window.storage.set("charges-data", JSON.stringify(parsed)).catch(() => {});
              effacerEchecSync();
              setBlocage(null);
              setLoadMsg(true);
              setLoaded(true);
              return;
            }
          } else {
            setBlocage("OneDrive a refusé la demande (code " + response.status + ").");
            setLoaded(true);
            return;
          }
          setBlocage("OneDrive a répondu, mais le fichier reçu est inutilisable.");
          setLoaded(true);
          return;
        } catch (e) {
          // 2) AUCUN repli sur le cache local ni sur les donnees figees.
          // Travailler sur une copie non verifiee est ce qui a provoque
          // l'incident du 19/08 : blocage total, choix assume.
          setBlocage(e && e.name === "AbortError"
            ? "OneDrive n'a pas répondu dans les 10 secondes."
            : "Impossible de joindre OneDrive." + (e && e.message ? " (" + e.message + ")" : ""));
          setLoaded(true);
          return;
        }
      } catch (e) {
        setBlocage("Erreur inattendue au démarrage." + (e && e.message ? " (" + e.message + ")" : ""));
      }
      setLoaded(true);
    })();
  }, [rechargement]);

  useEffect(() => {
    if (!loaded || !data) return;
    if (isInitialLoad.current) { isInitialLoad.current = false; return; }
    window.storage.set("charges-data", JSON.stringify(data)).catch(() => {});
    markPendingSync();
  }, [data, loaded]);

  const dataRef = React.useRef(data);
  useEffect(() => { dataRef.current = data; }, [data]);

  const declencheursInstalles = React.useRef(false);
  useEffect(() => {
    if (!loaded || declencheursInstalles.current) return;
    declencheursInstalles.current = true; // installe une seule fois
    initRappelsSauvegarde();
  }, [loaded]);

  if (blocage) {
    return (
      <div className="app-root" style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh", padding: 20 }}>
        <GlobalStyle />
        <div style={{ background: "#b91c1c", color: "#fff", borderRadius: 16, padding: "32px 24px", width: "100%", maxWidth: 460, textAlign: "center", boxShadow: "0 8px 40px rgba(0,0,0,0.3)" }}>
          <div style={{ fontSize: 56, marginBottom: 12 }}>🚫</div>
          <div style={{ fontSize: 22, fontWeight: 800, lineHeight: 1.3, marginBottom: 14 }}>
            IMPOSSIBLE DE CHARGER LES DONNÉES ONEDRIVE
          </div>
          <div style={{ fontSize: 15, lineHeight: 1.5, marginBottom: 10 }}>{blocage}</div>
          <div style={{ fontSize: 14, lineHeight: 1.5, opacity: 0.95, marginBottom: 24 }}>
            Aucune donnée n'est affichée et rien ne peut être modifié tant que OneDrive n'a pas répondu.
            C'est volontaire : travailler sur une copie non vérifiée risquerait d'écraser les données à jour.
          </div>
          <button onClick={() => { setBlocage(null); setLoaded(false); setRechargement(n => n + 1); }}
            style={{ background: "#fff", color: "#b91c1c", border: "none", borderRadius: 12, padding: "16px 32px", cursor: "pointer", fontWeight: 800, fontSize: 17, width: "100%" }}>
            🔄 Réessayer
          </button>
        </div>
      </div>
    );
  }

  if (!data) {
    return (
      <div className="app-root" style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh" }}>
        <GlobalStyle />
        <div style={{ color: MUTED }}>Chargement…</div>
      </div>
    );
  }

  const buildings = data.buildings;
  const currentBuilding = buildings.find(b => b.id === building);

  return (
    <div className="app-root">
      <GlobalStyle />
      <TopBar tab={tab} />
      {loadMsg && (
        <div style={{ position: "fixed", inset: 0, zIndex: 9999, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.6)" }}>
          <div style={{ background: "#16a34a", color: "#fff", borderRadius: 16, padding: "40px 32px", width: "90%", maxWidth: 420, minHeight: "45vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 32, boxShadow: "0 8px 40px rgba(0,0,0,0.4)" }}>
            <div style={{ fontSize: 64 }}>☁️</div>
            <div style={{ fontSize: 24, fontWeight: 800, textAlign: "center", lineHeight: 1.3 }}>
              Dernière sauvegarde OneDrive chargée, vous pouvez travailler.
            </div>
            <div style={{ fontSize: 15, textAlign: "center", opacity: 0.9 }}>
              Mais n'oubliez pas de sauvegarder !
            </div>
            <button onClick={() => setLoadMsg(false)} style={{ background: "#fff", color: "#16a34a", border: "none", borderRadius: 12, padding: "16px 40px", cursor: "pointer", fontWeight: 800, fontSize: 18, width: "100%" }}>
              ✓ Compris
            </button>
          </div>
        </div>
      )}
      {saveReminder && (
        <div style={{ background: "#b45309", color: "#fff", padding: "10px 16px", fontSize: 14, fontWeight: 600, position: "sticky", top: 0, zIndex: 998, textAlign: "center" }}>
          ⏰ N'oubliez pas de sauvegarder vos données !
        </div>
      )}
      {(tab === "buildings" || tab === "meters" || tab === "decomptes") && (
        <div className="seg">
          {buildings.map(b => (
            <button key={b.id} className={`segbtn ${building === b.id ? "active" : ""}`} onClick={() => setBuilding(b.id)}>
              {b.name}
            </button>
          ))}
        </div>
      )}
      <div className="content">
        {tab === "dashboard" && <Dashboard data={data} setData={setData} onGo={(b, t) => { setBuilding(b); setTab(t); }} />}
        {tab === "buildings" && <BuildingsView data={data} setData={setData} building={building} />}
        {tab === "meters" && <MetersView data={data} setData={setData} building={building} />}
        {tab === "decomptes" && <DecomptesView data={data} setData={setData} building={building} />}
        {tab === "search" && <SearchView data={data} onGo={(b, t) => { setBuilding(b); setTab(t); }} />}
        {tab === "aide" && <AideView />}
      </div>
      <BottomNav tab={tab} setTab={setTab} />
    </div>
  );
}

/* Sauvegarde OneDrive automatique */
function markPendingSync() { try { localStorage.setItem("charges-pending-sync", "1"); } catch (e) {} try { window.dispatchEvent(new Event("charges-sync-status")); } catch (e) {} }
function clearPendingSync() { try { localStorage.removeItem("charges-pending-sync"); localStorage.removeItem("charges-sync-echec"); localStorage.setItem("charges-last-sync", new Date().toISOString()); } catch (e) {} try { window.dispatchEvent(new Event("charges-sync-status")); } catch (e) {} }
function hasPendingSync() { try { return localStorage.getItem("charges-pending-sync") === "1"; } catch (e) { return false; } }
// Un echec de sauvegarde doit rester VISIBLE jusqu'a ce qu'une sauvegarde
// reussisse. Avant, l'echec etait avale par un .catch(() => {}) muet.
function marquerEchecSync(motif) { try { localStorage.setItem("charges-sync-echec", motif || "inconnu"); } catch (e) {} try { window.dispatchEvent(new Event("charges-sync-status")); } catch (e) {} }
function effacerEchecSync() { try { localStorage.removeItem("charges-sync-echec"); } catch (e) {} }
function getEchecSync() { try { return localStorage.getItem("charges-sync-echec"); } catch (e) { return null; } }
function getLastSync() { try { return localStorage.getItem("charges-last-sync"); } catch (e) { return null; } }
/* ------------------------------------------------------------
   DETECTION DE CONFLIT
   Instantane du fichier tel qu'il etait sur OneDrive au chargement.
   Avant toute ecriture, on relit OneDrive et on compare : si le contenu a
   change entre-temps, c'est que quelqu'un d'autre a enregistre, et ecraser
   ferait disparaitre son travail sans le moindre message.
   ------------------------------------------------------------ */
let snapshotOneDrive = null;
// Garantit la structure minimale attendue par l'application. Un compteur sans
// tableau de releves — fichier abime, edition a la main — faisait planter
// l'ecran au lieu d'afficher quoi que ce soit.
function garantirStructure(d) {
  if (!d || typeof d !== "object") return d;
  if (Array.isArray(d.meters)) {
    for (const m of d.meters) {
      if (!Array.isArray(m.readings)) m.readings = [];
    }
  }
  return d;
}

const normaliser = (obj) => JSON.stringify(obj); // compare le contenu, pas la mise en forme
function definirSnapshotOneDrive(objet) { try { snapshotOneDrive = normaliser(objet); } catch (e) { snapshotOneDrive = null; } }

// v32 — Enregistrement des donnees, extrait de syncOneDrive pour etre reutilise
// par les boutons « Sauver remboursement » : creer un document Word definitif
// sans conserver les montants qui l'ont produit etait un piege (le document
// partait, les chiffres restaient en memoire de l'onglet et disparaissaient).
// Renvoie { ok: true } ou { ok: false, conflit: bool, motif: string }.
// Ne touche a AUCUN etat React : l'appelant affiche ce qu'il veut.
async function enregistrerDonneesOneDrive(donnees) {
  let contenuActuel;
  try {
    contenuActuel = await lireOneDriveNormalise();
  } catch (e) {
    marquerEchecSync("Vérification impossible avant sauvegarde (" + e.message + ")");
    return { ok: false, conflit: false, motif: "impossible de vérifier OneDrive (" + e.message + ")" };
  }
  if (snapshotOneDrive !== null && contenuActuel !== snapshotOneDrive) {
    return { ok: false, conflit: true, motif: "quelqu'un d'autre a enregistré entre-temps" };
  }
  const json = JSON.stringify(donnees, null, 2);
  const base64 = btoa(unescape(encodeURIComponent(json)));
  let reponse;
  try {
    reponse = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "save", data: base64, filename: "charges-data.json" })
    });
  } catch (e) {
    marquerEchecSync("Connexion impossible (" + e.message + ")");
    return { ok: false, conflit: false, motif: "connexion impossible (" + e.message + ")" };
  }
  if (!reponse.ok) {
    marquerEchecSync("Réponse Make.com : " + reponse.status);
    return { ok: false, conflit: false, motif: "Make.com a répondu " + reponse.status };
  }
  definirSnapshotOneDrive(donnees);
  clearPendingSync();
  return { ok: true };
}

// Relit le fichier sur OneDrive. Leve une exception si la lecture echoue :
// l'appelant DOIT alors bloquer plutot que d'ecrire a l'aveugle.
async function lireOneDriveNormalise() {
  const controller = new AbortController();
  const minuteur = setTimeout(() => controller.abort(), 15000);
  try {
    const reponse = await fetch(WEBHOOK_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "import" }), signal: controller.signal,
    });
    if (!reponse.ok) throw new Error("Make.com a répondu " + reponse.status);
    const texte = await reponse.text();
    const decode = decodeURIComponent(escape(atob(texte.trim())));
    return normaliser(JSON.parse(decode));
  } finally {
    clearTimeout(minuteur);
  }
}

/* ------------------------------------------------------------
   PLUS AUCUN ENVOI AUTOMATIQUE (decision du 20/08).
   L'ancienne synchro d'arriere-plan partait a la fermeture de l'app, au
   retour du reseau et toutes les 5 minutes — sans jamais pouvoir verifier
   si quelqu'un d'autre avait enregistre entre-temps. Elle est supprimee :
   toute ecriture passe desormais par un clic explicite, precede d'une
   verification de conflit. En contrepartie, on previent a la fermeture
   quand des modifications ne sont pas enregistrees.
   ------------------------------------------------------------ */
function initRappelsSauvegarde() {
  window.addEventListener("beforeunload", (e) => {
    if (hasPendingSync()) { e.preventDefault(); e.returnValue = ""; return ""; }
  });
}

function SyncStatusBadge({ onReessayer, occupe }) {
  const [status, setStatus] = React.useState(() => ({ pending: hasPendingSync(), lastSync: getLastSync(), echec: getEchecSync() }));
  React.useEffect(() => {
    const update = () => setStatus({ pending: hasPendingSync(), lastSync: getLastSync(), echec: getEchecSync() });
    window.addEventListener("charges-sync-status", update);
    return () => window.removeEventListener("charges-sync-status", update);
  }, []);
  if (status.echec) {
    return (
      <div style={{ background: "#b91c1c", color: "#fff", borderRadius: 10, padding: "10px 12px", marginBottom: 10, fontSize: 13, fontWeight: 700, lineHeight: 1.4 }}>
        ⛔ LA DERNIÈRE SAUVEGARDE A ÉCHOUÉ — vos modifications ne sont PAS sur OneDrive.
        <div style={{ fontWeight: 400, marginTop: 4 }}>Motif : {status.echec}</div>
        <div style={{ fontWeight: 400, marginTop: 4 }}>Réessayez ci-dessous. Si l'échec persiste, exportez le fichier avec « Sauvegarde manuelle OneDrive » pour ne rien perdre.</div>
        <button onClick={onReessayer} disabled={occupe}
          style={{ background: "#fff", color: "#b91c1c", border: "none", borderRadius: 10, padding: "12px 20px", cursor: occupe ? "default" : "pointer", fontWeight: 800, fontSize: 15, width: "100%", marginTop: 10, opacity: occupe ? 0.6 : 1 }}>
          {occupe ? "Envoi en cours…" : "🔄 Réessayer la sauvegarde"}
        </button>
      </div>
    );
  }
  if (status.pending) {
    // Depuis la v9, plus rien ne part tout seul : ce message doit donc etre
    // un vrai avertissement, pas une simple information d'attente.
    return (
      <div style={{ background: "#fdf3e3", border: "2px solid #b45309", color: "#7c3f06", borderRadius: 10, padding: "10px 12px", marginBottom: 10, fontSize: 13.5, lineHeight: 1.5 }}>
        <div style={{ fontWeight: 800 }}>⏳ Modifications NON enregistrées</div>
        <div style={{ marginTop: 4 }}>Rien ne part tout seul. Appuie sur « Sauvegarde automatique OneDrive » avant de fermer.</div>
        <button onClick={onReessayer} disabled={occupe}
          style={{ background: "#b45309", color: "#fff", border: "none", borderRadius: 10, padding: "12px 20px", cursor: occupe ? "default" : "pointer", fontWeight: 800, fontSize: 15, width: "100%", marginTop: 8, opacity: occupe ? 0.6 : 1 }}>
          {occupe ? "Envoi en cours…" : "☁️ Enregistrer maintenant"}
        </button>
      </div>
    );
  }
  if (status.lastSync) {
    const d = new Date(status.lastSync);
    const timeStr = d.toLocaleString("fr-BE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    return <div style={{ fontSize: 12, fontWeight: 700, color: INK, marginBottom: 10 }}>☁️ Sauvegardé automatiquement le {timeStr}</div>;
  }
  return <div style={{ fontSize: 12, color: MUTED, marginBottom: 10 }}>☁️ Sauvegarde automatique pas encore effectuée</div>;
}

/* ============================================================
   AJUSTEMENTS DE PROVISION (par logement ET par periode de decompte)
   Stockes dans data.ajustementsProvision. Ne touchent JAMAIS
   unit.provisionMonthly, qui reste une donnee de bail.
   ============================================================ */
const cleAjustement = (building, unitId, from, to) => `${building}|${unitId}|${from}|${to}`;

// Analyse d'une saisie numerique tapee a la main.
// On n'utilise PAS <input type="number"> : la spec HTML impose que la valeur
// soit remise a la chaine vide des qu'elle n'est pas un nombre flottant valide
// (etats intermediaires comme "1." compris), ce qui rend impossible de
// distinguer "champ vide" de "saisie invalide" et provoquerait un
// enregistrement silencieux de 0. On lit donc du texte et on valide nous-memes.
// La virgule est acceptee (clavier decimal francais).
// Un montant en euros n'a jamais plus de deux decimales : on arrondit des la
// saisie, sinon les lignes d'un document ne collent plus a son total.
// 1,005 × 100 vaut 100,49999999999999 en machine : un arrondi naif donnerait
// 1,00 au lieu de 1,01. On remet le nombre a une precision utile avant d'arrondir.
const auCentime = (n) => {
  if (typeof n !== "number" || !isFinite(n)) return 0;
  return Math.round(Number((n * 100).toPrecision(12))) / 100;
};

const analyserNombre = (txt) => {
  const brut = String(txt).trim().replace(",", ".");
  if (brut === "") return { vide: true, valide: false, valeur: null };
  if (!/^-?\d*\.?\d*$/.test(brut)) return { vide: false, valide: false, valeur: null };
  const v = parseFloat(brut);
  if (isNaN(v)) return { vide: false, valide: false, valeur: null };
  return { vide: false, valide: true, valeur: v };
};
const lireAjustement = (data, cle) => (data.ajustementsProvision && data.ajustementsProvision[cle]) || {};

/* ============================================================
   BACKUP / SYNC (export & import full dataset as JSON, e.g. via OneDrive)
   ============================================================ */
function BackupBar({ data, setData }) {
  const [msg, setMsg] = useState(null); // { type: "ok"|"err", text }
  const [busy, setBusy] = useState(false);
  const [conflit, setConflit] = useState(false);
  const fileInputRef = useRef(null);

  const flash = (type, text) => {
    setMsg({ type, text });
    setTimeout(() => setMsg(null), 4000);
  };

  const exportData = async () => {
    setBusy(true);
    try {
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const filename = "charges-data.json";
      const file = new File([blob], filename, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file] });
          flash("ok", "✓ Sauvegarde exportée");
        } catch (e) {
          // user cancelled the share sheet — not an error
        }
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        flash("ok", "✓ Sauvegarde téléchargée");
      }
    } catch (e) {
      flash("err", "Erreur lors de l'export : " + e.message);
    } finally {
      setBusy(false);
    }
  };

  const syncOneDrive = async () => {
    setBusy(true);
    try {
      // v32 : verification de conflit + ecriture regroupees dans
      // enregistrerDonneesOneDrive(), partagee avec « Sauver remboursement ».
      const res = await enregistrerDonneesOneDrive(data);
      if (res.ok) {
        flash("ok", "✓ Sauvegarde automatique OneDrive réussie");
      } else if (res.conflit) {
        setConflit(true);
        flash("err", "Sauvegarde bloquée — conflit détecté.");
      } else {
        flash("err", "Sauvegarde annulée : " + res.motif);
      }
    } finally {
      setBusy(false);
    }
  };

  const importData = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    setBusy(true);
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = garantirStructure(JSON.parse(String(reader.result)));
        if (!parsed.buildings || !parsed.meters) throw new Error("Format de fichier inattendu");
        setData(parsed);
        flash("ok", "✓ Données importées");
      } catch (err) {
        flash("err", "Fichier invalide : " + err.message);
      } finally {
        setBusy(false);
        e.target.value = "";
      }
    };
    reader.onerror = () => { flash("err", "Impossible de lire le fichier"); setBusy(false); };
    reader.readAsText(f);
  };

  return (
    <div className="card">
      <div style={{ fontWeight: 700, marginBottom: 8 }}>Sauvegarde & synchronisation</div>
      {conflit && (
        <div style={{ background: "#b91c1c", color: "#fff", borderRadius: 10, padding: "12px 14px", marginBottom: 10, fontSize: 13.5, lineHeight: 1.5 }}>
          <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 6 }}>⚠️ CONFLIT DÉTECTÉ</div>
          Quelqu'un d'autre a enregistré sur OneDrive depuis que tu as ouvert l'application.
          <div style={{ fontWeight: 800, marginTop: 6 }}>Sauvegarder maintenant écraserait son travail.</div>
          <div style={{ marginTop: 6 }}>
            Note d'abord ce que tu viens de saisir, ou exporte-le avec « Sauvegarde manuelle OneDrive » —
            recharger fera perdre tes modifications non enregistrées.
          </div>
          <button onClick={() => window.location.reload()}
            style={{ background: "#fff", color: "#b91c1c", border: "none", borderRadius: 10, padding: "12px 20px", cursor: "pointer", fontWeight: 800, fontSize: 15, width: "100%", marginTop: 10 }}>
            🔄 Recharger la version à jour
          </button>
        </div>
      )}
      <SyncStatusBadge onReessayer={syncOneDrive} occupe={busy} />
      <div style={{ fontSize: 12, color: MUTED, marginBottom: 10 }}>
        <b>Sauvegarde manuelle</b> : exporte le fichier via la feuille de partage iOS (OneDrive, etc.).<br/>
        <b>Sauvegarde automatique</b> : envoie directement vers OneDrive via Make.com en un clic.<br/>
        <b>Chargement OneDrive</b> : automatique à chaque ouverture de l'application.
      </div>
      <div className="row" style={{ flexWrap: "wrap" }}>
        <button className="btn btn-primary" onClick={exportData} disabled={busy}>
          <Download size={15} /> Sauvegarde manuelle OneDrive
        </button>
        <button className="btn btn-primary" onClick={syncOneDrive} disabled={busy} style={{ background: "linear-gradient(135deg,#4f6ef7,#7c3aed)", border: "none" }}>
          ☁️ Sauvegarde automatique OneDrive
        </button>
        <button className="btn btn-ghost" onClick={() => fileInputRef.current?.click()} disabled={busy}>
          <Save size={15} /> Importation manuelle (fichier)
        </button>
        <input ref={fileInputRef} type="file" accept="application/json,.json" style={{ display: "none" }} onChange={importData} />
      </div>
      {msg && (
        <div style={{ marginTop: 8, fontSize: 13, fontWeight: 700, color: msg.type === "ok" ? INK : RED }}>
          {msg.text}
        </div>
      )}
    </div>
  );
}

function sumLastInterval(meters) {
  let conso = 0, cost = 0, n = 0;
  meters.forEach(m => {
    const li = lastInterval(m.readings);
    if (li) { conso += li.conso; cost += li.cost; n++; }
  });
  return { conso, cost, n };
}

// Compare chaque compteur individuel (déjà existant pour ce type/immeuble) à
// la date du dernier relevé du/des compteur(s) général/aux correspondant(s).
// "Pas à jour" = dernier relevé antérieur à celui du général le plus récent.
function missingUpToDateMeters(data, building, type, unitNames) {
  const meters = data.meters.filter(m => m.building === building && m.type === type);
  const general = meters.filter(m => m.scope === "general");
  const individual = meters.filter(m => m.scope === "unit");
  if (individual.length === 0) return { total: 0, missing: 0, names: [] };
  const generalDates = general.map(m => m.readings[m.readings.length - 1]?.[0]).filter(Boolean);
  if (generalDates.length === 0) return { total: individual.length, missing: 0, names: [] };
  const generalLastDate = generalDates.slice().sort().slice(-1)[0];
  const names = [];
  individual.forEach(m => {
    const last = m.readings[m.readings.length - 1]?.[0];
    if (!last || last < generalLastDate) names.push(unitNames?.[m.unit] || m.unit);
  });
  return { total: individual.length, missing: names.length, names };
}

function getAdjustment(data, building, type) {
  const a = data.adjustments?.[building]?.[type];
  return a || { mode: "none", factor: 1 };
}

function AdjustmentBlock({ data, setData, building, type, gen, ind, label, unitLabel, nUnits, onShowReport }) {
  const adjustment = getAdjustment(data, building, type);
  const diffCost = gen.cost - ind.cost;
  const diffConso = gen.conso - ind.conso;
  const significant = ind.cost > 0 && Math.abs(diffCost) > Math.max(5, gen.cost * 0.05);
  const coverage = nUnits > 0 ? ind.n / nUnits : 0;
  const lowCoverage = coverage < 0.4;

  const priceFactor = ind.cost > 0 ? gen.cost / ind.cost : 1;
  const consoFactor = ind.conso > 0 ? gen.conso / ind.conso : 1;

  const apply = (mode, factor) => {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.adjustments) next.adjustments = {};
      if (!next.adjustments[building]) next.adjustments[building] = {};
      next.adjustments[building][type] = { mode, factor };
      return next;
    });
  };
  const reset = () => apply("none", 1);

  if (!significant && adjustment.mode === "none") return null;

  if (lowCoverage) {
    return (
      <div style={{ marginBottom: 14, padding: 10, background: PAPER, borderRadius: 10 }}>
        <div style={{ fontWeight: 700, marginBottom: 4 }}>{label}</div>
        <div style={{ fontSize: 13, color: MUTED }}>

          comparer leur somme au compteur général n'a pas de sens (la majorité des logements
          ne sont pas couverts). Pas d'ajustement automatique proposé ici ; utilisez la quote-part
          manuelle ou les factures ISTA dans "Décomptes" pour les logements sans compteur.
        </div>
        {adjustment.mode !== "none" && (
          <button className="btn btn-ghost" style={{ marginTop: 8 }} onClick={reset}><X size={14} /> Annuler l'ajustement existant</button>
        )}
      </div>
    );
  }

  const sign = diffCost < 0 ? "supérieure" : "inférieure";

  return (
    <div style={{ marginBottom: 14, padding: 10, background: PAPER, borderRadius: 10 }}>
      <div style={{ fontWeight: 700, marginBottom: 4 }}>{label}</div>
      <div style={{ fontSize: 13, color: MUTED, marginBottom: 8, lineHeight: 1.5 }}>
        Le compteur général indique <b>{fmtEUR(gen.cost)}</b> ({fmtNum(gen.conso, 1)} {unitLabel}).
        La somme des {ind.n} compteurs individuels donne <b>{fmtEUR(ind.cost)}</b> ({fmtNum(ind.conso, 1)} {unitLabel}) —
        une somme {sign} de {fmtEUR(Math.abs(diffCost))}.
      </div>
      <div style={{ fontSize: 13, marginBottom: 8, lineHeight: 1.6 }}>
        <b>Choisissez comment répartir cet écart sur les logements :</b>
        <ul style={{ margin: "6px 0 0 0", paddingLeft: 18 }}>
          <li style={{ marginBottom: 4 }}>
            <b>Ajuster le prix</b> : on garde la consommation de chaque compteur telle que relevée,
            mais on multiplie son coût par <b>{fmtNum(priceFactor, 3)}</b> (= {fmtEUR(gen.cost)} ÷ {fmtEUR(ind.cost)}).
            Résultat : la somme des coûts individuels redevient {fmtEUR(gen.cost)}, identique au général.
          </li>
          <li>
            <b>Ajuster la consommation</b> : on multiplie consommation ET coût de chaque compteur par <b>{fmtNum(consoFactor, 3)}</b>
            (= {fmtNum(gen.conso, 1)} ÷ {fmtNum(ind.conso, 1)} {unitLabel}). Résultat : la somme des consommations
            individuelles redevient {fmtNum(gen.conso, 1)} {unitLabel}, comme si chaque locataire avait consommé un peu
            plus (ou moins).
          </li>
        </ul>
      </div>
      <div className="row" style={{ flexWrap: "wrap" }}>
        <button className={`btn ${adjustment.mode === "price" ? "btn-primary" : "btn-ghost"}`} onClick={() => apply("price", priceFactor)}>
          Ajuster le prix (×{fmtNum(priceFactor, 3)})
        </button>
        <button className={`btn ${adjustment.mode === "conso" ? "btn-primary" : "btn-ghost"}`} onClick={() => apply("conso", consoFactor)}>
          Ajuster la consommation (×{fmtNum(consoFactor, 3)})
        </button>
        {adjustment.mode !== "none" && (
          <button className="btn btn-ghost" onClick={reset}><X size={14} /> Annuler</button>
        )}
      </div>
      <div style={{ fontSize: 12, color: adjustment.mode !== "none" ? ACCENT : MUTED, marginTop: 8, fontWeight: adjustment.mode !== "none" ? 700 : 400 }}>
        {adjustment.mode === "price" && `Actif : chaque logement voit son coût ${type} multiplié par ${fmtNum(priceFactor, 3)} dans les décomptes.`}
        {adjustment.mode === "conso" && `Actif : chaque logement voit sa consommation et son coût ${type} multipliés par ${fmtNum(consoFactor, 3)} dans les décomptes.`}
        {adjustment.mode === "none" && "Aucun ajustement appliqué — les décomptes utilisent les valeurs brutes des compteurs individuels."}
      </div>
      <button className="btn btn-ghost" style={{ marginTop: 8 }} onClick={() => onShowReport(type)}>
        <FileText size={14} /> Voir le rapport détaillé (impression / PDF)
      </button>
    </div>
  );
}

function BilanCard({ data, setData, building, onShowReport }) {
  const b = data.buildings.find(x => x.id === building);
  const meters = data.meters.filter(m => m.building === building);
  const general = meters.filter(m => m.scope === "general");
  const units = meters.filter(m => m.scope === "unit");

  const genElecMeters = general.filter(m => m.type === "elec");
  const indElecMeters = units.filter(m => m.type === "elec");
  const genEauMeters = general.filter(m => m.type === "eau");
  const indEauMeters = units.filter(m => m.type === "eau");

  const genElec = sumLastInterval(genElecMeters);
  const indElec = sumLastInterval(indElecMeters);
  const genEau = sumLastInterval(genEauMeters);
  const indEau = sumLastInterval(indEauMeters);
  const genGaz = general.filter(m => m.type === "gaz");
  const gazSum = sumLastInterval(genGaz);

  const generalCount = { elec: genElecMeters.length, eau: genEauMeters.length, gaz: genGaz.length };
  const nUnits = b.units.length;
  const unitNames = {};
  b.units.forEach(u => { unitNames[u.id] = u.name; });
  const missingElec = missingUpToDateMeters(data, building, "elec", unitNames);
  const missingEau = building === "nimy" ? null : missingUpToDateMeters(data, building, "eau", unitNames);

  const MissingAlert = ({ info }) => {
    if (!info || info.missing === 0) return null;
    return (
      <div style={{ fontSize: 12, color: ACCENT, fontWeight: 700, marginBottom: 8, padding: 8, background: "#FBF2E4", borderRadius: 8 }}>
        ⚠️ {info.missing} compteur{info.missing > 1 ? "s" : ""} individuel{info.missing > 1 ? "s" : ""} pas encore relevé{info.missing > 1 ? "s" : ""} pour cette période ({info.names.join(", ")})
      </div>
    );
  };

  return (
    <div className="card">
      <div style={{ fontWeight: 700, marginBottom: 4 }}>Bilan — compteurs généraux vs individuels</div>
      <div style={{ fontSize: 12, color: MUTED, marginBottom: 12 }}>
        Comparaison sur la dernière période relevée pour chaque compteur. Un écart important (en{" "}
        <span style={{ color: RED, fontWeight: 700 }}>rouge</span>) peut indiquer une fuite, un vol, ou un relevé manquant.
      </div>

      <MissingAlert info={missingElec} />
      <BilanRow label={`Électricité (${generalCount.elec} compteur(s) général/aux)`} gen={genElec} ind={indElec} unit="kWh" adjustment={getAdjustment(data, building, "elec")} />
      <AdjustmentBlock data={data} setData={setData} building={building} type="elec" gen={genElec} ind={indElec} label="Ajustement Électricité" unitLabel="kWh" nUnits={nUnits} onShowReport={onShowReport} />

      <MissingAlert info={missingEau} />
      <BilanRow label={`Eau (${generalCount.eau} compteur(s) général/aux)`} gen={genEau} ind={indEau} unit="m³" adjustment={getAdjustment(data, building, "eau")} />
      <AdjustmentBlock data={data} setData={setData} building={building} type="eau" gen={genEau} ind={indEau} label="Ajustement Eau" unitLabel="m³" nUnits={nUnits} onShowReport={onShowReport} />

      {genGaz.length > 0 && (
        <div>
          <div style={{ fontWeight: 700, marginBottom: 6 }}>Gaz / chauffage (compteur général)</div>
          <div style={{ fontSize: 13 }}>
            Dernière période : <b>{fmtNum(gazSum.conso, 1)} m³</b> — <b>{fmtEUR(gazSum.cost)}</b>
          </div>
          <div style={{ fontSize: 12, color: MUTED, marginTop: 4 }}>
            Pas de compteur individuel — ce coût est réparti via la quote-part saisie dans "Décomptes" (ou les factures ISTA).
          </div>
        </div>
      )}
    </div>
  );
}

function ReportView({ data, building, type, onClose }) {
  const b = data.buildings.find(x => x.id === building);
  const meters = data.meters.filter(m => m.building === building && m.type === type);
  const general = meters.filter(m => m.scope === "general");
  const units = meters.filter(m => m.scope === "unit");
  const gen = sumLastInterval(general);
  const ind = sumLastInterval(units);
  const diffConso = gen.conso - ind.conso;
  const diffCost = gen.cost - ind.cost;
  const adjustment = getAdjustment(data, building, type);
  const priceFactor = ind.cost > 0 ? gen.cost / ind.cost : 1;
  const consoFactor = ind.conso > 0 ? gen.conso / ind.conso : 1;
  const typeLabel = TYPE_LABEL[type] || type;

  const meterRow = (m) => {
    const li = lastInterval(m.readings);
    const unitName = m.unit ? (b.units.find(u => u.id === m.unit)?.name || m.unit) : "—";
    return (
      <tr key={m.id}>
        <td>{unitName}</td>
        <td>{m.label}</td>
        <td>{li ? fmtDate(li.fromDate) : "—"}</td>
        <td>{li ? fmtDate(li.toDate) : "—"}</td>
        <td>{li ? fmtNum(li.conso, 1) : "—"}</td>
        <td>{li ? fmtEUR(li.cost) : "—"}</td>
      </tr>
    );
  };

  return (
    <div className="app-root" style={{ position: "fixed", inset: 0, zIndex: 100, overflow: "auto", padding: 16, paddingTop: "calc(16px + env(safe-area-inset-top))" }}>
      <style>{`
        @media print {
          .no-print { display: none !important; }
          .app-root { padding: 0 !important; }

      `}</style>
      <div className="no-print row" style={{ marginBottom: 12 }}>
        <button className="btn btn-ghost" onClick={onClose}><ArrowLeft size={15} /> Retour</button>
        <button className="btn btn-primary" onClick={() => window.print()}><FileText size={15} /> Imprimer / Enregistrer en PDF</button>

      <div className="display" style={{ fontSize: 20, fontWeight: 700, marginBottom: 4 }}>
        Rapport d'écart — {typeLabel}
      </div>
      <div style={{ fontSize: 13, color: MUTED, marginBottom: 16 }}>
        {b.name} · établi le {fmtDate(todayISO())}
      </div>

      <div className="card">
        <div style={{ fontWeight: 700, marginBottom: 8 }}>1. Compteurs généraux ({general.length})</div>
        <div className="scrollx">
          <table className="tbl">
            <thead><tr><th>Logement</th><th>Compteur</th><th>Du</th><th>Au</th><th>Conso.</th><th>Coût</th></tr></thead>
            <tbody>{general.map(meterRow)}</tbody>
            <tfoot><tr style={{ fontWeight: 700 }}><td colSpan={4}>Total général</td><td>{fmtNum(gen.conso, 1)}</td><td>{fmtEUR(gen.cost)}</td></tr></tfoot>
          </table>
        </div>
      </div>

      <div className="card">
        <div style={{ fontWeight: 700, marginBottom: 8 }}>2. Compteurs individuels ({units.length})</div>
        <div className="scrollx">
          <table className="tbl">
            <thead><tr><th>Logement</th><th>Compteur</th><th>Du</th><th>Au</th><th>Conso.</th><th>Coût</th></tr></thead>
            <tbody>{units.map(meterRow)}</tbody>
            <tfoot><tr style={{ fontWeight: 700 }}><td colSpan={4}>Total individuels</td><td>{fmtNum(ind.conso, 1)}</td><td>{fmtEUR(ind.cost)}</td></tr></tfoot>
          </table>
        </div>
      </div>

      <div className="card">
        <div style={{ fontWeight: 700, marginBottom: 8 }}>3. Écart constaté</div>
        <p style={{ fontSize: 14, lineHeight: 1.6 }}>
          Le ou les compteurs généraux totalisent <b>{fmtNum(gen.conso, 1)} {type === "elec" ? "kWh" : "m³"}</b> pour
          un coût de <b>{fmtEUR(gen.cost)}</b> sur la dernière période relevée.
          La somme des {units.length} compteurs individuels donne <b>{fmtNum(ind.conso, 1)} {type === "elec" ? "kWh" : "m³"}</b>
          pour <b>{fmtEUR(ind.cost)}</b>.
        </p>
        <p style={{ fontSize: 14, lineHeight: 1.6 }}>
          Écart : <b style={{ color: Math.abs(diffCost) > 5 ? RED : INK }}>{fmtNum(diffConso, 1)} {type === "elec" ? "kWh" : "m³"}</b> et{" "}
          <b style={{ color: Math.abs(diffCost) > 5 ? RED : INK }}>{fmtEUR(diffCost)}</b>.
          {diffCost > 0
            ? " Le compteur général est supérieur à la somme des individuels (pertes communes, parties communes non comptées individuellement, ou relevé individuel manquant/sous-estimé)."
            : " La somme des compteurs individuels est supérieure au compteur général (relevé général en retard, tarif différent, ou double comptage)."}
        </p>
      </div>

      <div className="card">
        <div style={{ fontWeight: 700, marginBottom: 8 }}>4. Méthode de correction</div>

        </p>

          <b>Option B — Ajuster la consommation</b> : facteur = consommation générale ÷ consommation individuelle = {fmtNum(gen.conso, 1)} ÷ {fmtNum(ind.conso, 1)} = <b>{fmtNum(consoFactor, 4)}</b>.
          Chaque logement voit sa consommation ET son coût {typeLabel.toLowerCase()} multipliés par {fmtNum(consoFactor, 4)}.
        </p>
        <p style={{ fontSize: 14, lineHeight: 1.6, fontWeight: 700, color: adjustment.mode !== "none" ? ACCENT : MUTED }}>

          {adjustment.mode === "conso" && `L'option B (consommation, facteur ${fmtNum(adjustment.factor, 4)}) est actuellement appliquée dans les décomptes.`}
        </p>
      </div>
    </div>
  );
}

// Reference de chaque logement chez ISTA, telle qu'elle figure sur la facture
// (« App 0002 / 01 001 ») et dans la liste des locataires. Ces references ne
// changent pas, contrairement aux noms de locataires qu'ISTA garde perimes.
const REFERENCE_ISTA = {
  "ptg|appart1er": "01 001",
  "ptg|duplex":    "01 002",
  "ptg|appart3":   "01 003",
  "ptg|studio4":   "01 004",
  "ptg|studio5":   "01 005",
  "ptg|studio6":   "01 006",
  "ptg|studio7":   "02 007",
  "ptg|studio8":   "02 008",
  "ptg|studio9":   "03 009",
  "ptg|studio10":  "03 010",
};

const referenceIsta = (building, unitId) => REFERENCE_ISTA[building + "|" + unitId] || null;

function IstaRow({ data, setData, building, unitId }) {
  const ista = (data.ista || []).find(i => i.building === building && i.unit === unitId);
  const [open, setOpen] = useState(false);
  const [nouvelleDate, setNouvelleDate] = useState(todayISO());
  const [nouveauMontant, setNouveauMontant] = useState("");
  const [erreur, setErreur] = useState(null);
  const reference = referenceIsta(building, unitId);
  const factures = (ista && ista.invoices) || [];

  // Le logement est facture par ISTA mais n'a encore aucune facture : on affiche
  // quand meme le bloc, sinon il n'y aurait aucun moyen d'en saisir une.
  const unite = (data.buildings.find(b => b.id === building) || { units: [] })
    .units.find(u => u.id === unitId);
  if (!ista && !(unite && unite.hasIsta)) return null;

  const ajouter = () => {
    const r = analyserNombre(nouveauMontant);
    if (r.vide) { setErreur("Indiquez le montant de la facture."); return; }
    if (!r.valide) { setErreur("Montant invalide."); return; }
    if (r.valeur <= 0) { setErreur("Le montant doit être positif."); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(nouvelleDate)) { setErreur("Indiquez la date de la facture."); return; }
    setErreur(null);
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!Array.isArray(next.ista)) next.ista = [];
      let entree = next.ista.find(i => i.building === building && i.unit === unitId);
      if (!entree) {
        entree = { building, unit: unitId, label: "Eau / chauffage (facture ISTA)", invoices: [] };
        next.ista.push(entree);
      }
      if (!Array.isArray(entree.invoices)) entree.invoices = [];
      entree.invoices.push([nouvelleDate, auCentime(r.valeur)]);
      entree.invoices.sort((a, b) => String(a[0]).localeCompare(String(b[0])));
      return next;
    });
    setNouveauMontant("");
    setOpen(true);
  };

  const supprimer = (dateFacture, montant) => {
    if (!window.confirm("Supprimer la facture ISTA du " + fmtDate(dateFacture)
      + " (" + fmtEUR(montant) + ") ? Cette ligne sera définitivement retirée.")) return;
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const entree = (next.ista || []).find(i => i.building === building && i.unit === unitId);
      if (!entree) return next;
      const idx = entree.invoices.findIndex(x => x[0] === dateFacture && x[1] === montant);
      if (idx >= 0) entree.invoices.splice(idx, 1);
      return next;
    });
  };

  return (
    <div style={{ borderTop: `1px solid ${LINE}`, marginTop: 6, paddingTop: 6 }}>
      <div className="between" style={{ cursor: "pointer" }} onClick={() => setOpen(v => !v)}>
        <div className="row" style={{ fontSize: 14 }}>
          <Flame size={15} color={TYPE_COLOR.gaz} /> {(ista && ista.label) || "Eau / chauffage (facture ISTA)"}
          <span className="label" style={{ margin: 0 }}>
            {factures.length} {factures.length > 1 ? "factures" : "facture"}
          </span>
          {reference && (
            <span className="label" style={{ margin: 0 }}>réf. ISTA {reference}</span>
          )}
        </div>
        {open ? <ChevronDown size={16} /> : <ChevronRight size={16} />}
      </div>
      {open && (
        <div style={{ marginTop: 6 }}>
          <div className="scrollx">
            <table className="tbl">
              <thead><tr><th>Date</th><th>Montant</th><th></th></tr></thead>
              <tbody>
                {factures.slice().reverse().map((inv, i) => (
                  <tr key={i}>
                    <td>{fmtDate(inv[0])}</td>
                    <td>{fmtEUR(inv[1])}</td>
                    <td style={{ textAlign: "right" }}>
                      <button className="btn btn-ghost" style={{ padding: "2px 8px", fontSize: 12 }}
                        onClick={() => supprimer(inv[0], inv[1])}>Supprimer</button>
                    </td>
                  </tr>
                ))}
                {factures.length === 0 && (
                  <tr><td colSpan={3} style={{ color: MUTED }}>Aucune facture enregistrée pour ce logement.</td></tr>
                )}
              </tbody>
            </table>
          </div>

          <div style={{ marginTop: 10, background: PAPER, borderRadius: 8, padding: "10px 12px" }}>
            <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 6 }}>Ajouter une facture ISTA</div>
            <div className="row" style={{ alignItems: "flex-end", flexWrap: "wrap" }}>
              <div>
                <span className="label">Date de la facture</span>
                <input type="date" value={nouvelleDate} onChange={e => setNouvelleDate(e.target.value)} />
              </div>
              <div>
                <span className="label">Montant (€)</span>
                <input type="text" inputMode="decimal" placeholder="0" value={nouveauMontant}
                  onChange={e => { setNouveauMontant(e.target.value); setErreur(null); }} />
              </div>
              <button className="btn btn-accent" onClick={ajouter}>Ajouter</button>
            </div>
            {erreur && (
              <div style={{ fontSize: 12, color: "#b91c1c", marginTop: 6, fontWeight: 600 }}>{erreur}</div>
            )}
            <div style={{ fontSize: 12, color: MUTED, marginTop: 8, lineHeight: 1.5 }}>
              Le montant se trouve à la ligne « SOLDE » de la facture ISTA
              {reference ? ", sur le feuillet portant la référence " + reference : ""}.
              Ces factures sont conservées : pensez à « ☁️ Sauvegarde automatique OneDrive ».
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

          </div>
        </div>

function MeterDetail({ data, setData, meter, onBack }) {
  const [showForm, setShowForm] = useState(false);
  const last = meter.readings[meter.readings.length - 1];
  const [newDate, setNewDate] = useState(todayISO());
  const [newIndex, setNewIndex] = useState("");
  const [newRate, setNewRate] = useState(last ? last[2] : "");

  const conso = newIndex !== "" && last ? (parseFloat(newIndex) - last[1]) : null;
  const days = last ? daysBetween(last[0], newDate) : null;
  const cost = conso !== null && newRate !== "" ? conso * parseFloat(newRate) : null;

  // Previous period (the interval ending at `last`), for the ±20% comparison.
  const prevPeriod = meter.readings.length >= 2 ? meter.readings[meter.readings.length - 2] : null;
  const prevConsoPerDay = prevPeriod && last && last[5] ? last[3] / last[5] : null;
  const newConsoPerDay = conso !== null && days ? conso / days : null;
  let consoAlertPct = null;
  if (prevConsoPerDay !== null && prevConsoPerDay > 0 && newConsoPerDay !== null) {
    consoAlertPct = ((newConsoPerDay - prevConsoPerDay) / prevConsoPerDay) * 100;
  }
  const consoAlert = consoAlertPct !== null && Math.abs(consoAlertPct) >= 20 ? consoAlertPct : null;

  const [lastAlert, setLastAlert] = useState(null);

  const addReading = () => {
    if (newIndex === "" || !newDate) return;
    const alertPct = consoAlert; // capture before state resets
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const m = next.meters.find(x => x.id === meter.id);
      m.readings.push([newDate, parseFloat(newIndex), parseFloat(newRate) || 0, conso ?? 0, cost ?? 0, days ?? 0]);
      return next;
    });
    setShowForm(false);
    setNewIndex("");
    setLastAlert(alertPct !== null ? { pct: alertPct, date: newDate } : null);
  };

      if (m.readings[index]) {
